<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Items · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/app.css">
<style>
main{max-width:1300px}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:900px){.shop{grid-template-columns:1fr}}
.cat{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--panel)}.cat h2{margin:0 0 8px;font-family:Reaver;text-transform:uppercase;letter-spacing:.05em;font-size:18px}
.cat.weapon h2{color:var(--weapon)}.cat.spirit h2{color:var(--spirit)}.cat.vitality h2{color:var(--vitality)}
.tier{margin-bottom:10px}.tier .th{font-size:11px;color:var(--muted);text-transform:uppercase;margin:6px 0 4px;display:flex;justify-content:space-between}
.tier .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.it{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#0a0b0f;border:1px solid #262a38;aspect-ratio:1}.it img{width:100%;height:100%;object-fit:cover}.it:hover{border-color:var(--accent)}
.it.active::after{content:"A";position:absolute;top:2px;right:4px;font-size:10px;color:#fff;background:#2a2f44;border-radius:3px;padding:0 3px}
.it.dim{opacity:.2}
.detail{position:sticky;top:70px}
</style></head>
<body><main>
<h1>Items</h1>
<p class="muted">The in-game shop. Hover for tooltips; click an item to pin its details. <input type="text" id="q" placeholder="Search items or stats…" style="margin-left:10px;width:260px"> <select id="hero"><option value="">Any hero</option></select></p>
<div class="shop" id="shop"></div>
<div id="pin"></div>
</main>
<script type="module">
import { api, h, $, items, heroes, itemTooltip, withTip, shell } from "/js/app.js";
shell("/items.html");
const [its, hs] = await Promise.all([items(), heroes()]); hs.forEach((x) => $("#hero").append(new Option(x.name, x.id)));
function render() { const q = $("#q").value.toLowerCase(); const heroId = +$("#hero").value;
  const match = (i) => (!q || i.name.toLowerCase().includes(q) || (i.stats || []).some((s) => s.label.toLowerCase().includes(q))) && (!heroId || !i.heroes?.length || i.heroes.includes(heroId));
  $("#shop").replaceChildren(...["weapon", "vitality", "spirit"].map((slot) => h("div", { class: "cat " + slot }, h("h2", {}, slot),
    ...[1, 2, 3, 4].map((t) => { const rows = its.filter((i) => i.slot === slot && i.tier === t).sort((a, b) => a.name.localeCompare(b.name)); return h("div", { class: "tier" }, h("div", { class: "th" }, h("span", {}, `Tier ${t}`), h("span", {}, `${rows[0]?.cost?.toLocaleString() ?? ""} souls`)),
      h("div", { class: "items" }, ...rows.map((i) => withTip(h("div", { class: "it" + (i.active ? " active" : "") + (match(i) ? "" : " dim"), onclick: () => pin(i) }, h("img", { src: i.image, alt: i.name, loading: "lazy" })), i)))); })))); }
function pin(i) { const card = itemTooltip(i); card.style.width = "auto"; card.style.pointerEvents = "auto"; card.classList.add("card"); $("#pin").replaceChildren(h("h2", {}, i.name), card, h("p", {}, h("a", { href: `/editor.html?item=${i.id}` }, "Start a build with this item"))); $("#pin").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
$("#q").oninput = render; $("#hero").onchange = render; render();
</script></body></html>
