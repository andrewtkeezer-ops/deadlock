<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build editor · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/icon.png"><link rel="stylesheet" href="/css/app.css">
<style>
.ed{display:grid;grid-template-columns:1fr 320px;gap:16px}@media(max-width:800px){.ed{grid-template-columns:1fr}}
.phase{margin-bottom:12px}.phase h3{margin:0 0 6px;display:flex;gap:8px;align-items:center}.phase h3 input{flex:1}
.mods{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border:1px dashed var(--line);border-radius:8px}
.mod{display:flex;align-items:center;gap:6px;background:#1f2230;border-radius:6px;padding:4px 6px;font-size:13px}.mod img{width:28px;height:28px;border-radius:4px}.mod button{padding:0 6px;line-height:1.4}
.picker{position:sticky;top:70px;max-height:80vh;overflow:auto}.pick{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px;cursor:pointer}.pick:hover{background:#1d2030}.pick img{width:30px;height:30px;border-radius:4px}.pick .cost{margin-left:auto;color:var(--muted);font-size:12px}
.note{width:110px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
</style></head>
<body><main>
<p><a href="/library.html">← Build library</a></p>
<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<select id="hero"></select> <input type="text" id="title" placeholder="Build name" style="flex:1;min-width:200px"> <button class="primary" id="save">Save</button> <button id="fork" hidden>Fork a copy</button> <button id="del" hidden>Delete</button> <span id="msg"></span></div>
<p><input type="text" id="desc" placeholder="Description / how to play it (optional)" style="width:100%"></p>
<p id="owner" class="muted"></p></div>
<div class="ed">
<div id="phases"></div>
<div class="card picker"><input type="text" id="search" placeholder="Search items…" style="width:100%"> <div style="margin:6px 0"><label><input type="radio" name="slot" value="" checked> All</label> <label><input type="radio" name="slot" value="weapon"> Weapon</label> <label><input type="radio" name="slot" value="vitality"> Vitality</label> <label><input type="radio" name="slot" value="spirit"> Spirit</label></div>
<p class="muted" style="font-size:12px">Click an item to add it to the phase marked <strong>+</strong> (click a phase title to target it).</p><div id="items"></div></div>
</div></main>
<script type="module">
import { api, h, $, heroes, withTip, heroIcon, shell } from "/js/app.js";
shell("/library.html");
const qs = new URLSearchParams(location.search); const id = qs.get("id");
const [hs, items, me, cats] = await Promise.all([heroes(), api("/library/items"), api("/auth/steam/me"), api("/library/categories")]);
hs.forEach((x) => $("#hero").append(new Option(x.name, x.id)));
const item = (i) => items.find((x) => x.id === i);
let build = { hero_id: +qs.get("hero") || hs[0].id, title: "", description: "", details: { mod_categories: cats.map((name) => ({ name, mods: [] })) }, account_id: null };
let target = 0, mine = true;
if (id) { build = await api(`/library/${id}`); mine = me.account_id && me.account_id === build.account_id; }
else if (qs.get("from") === "wizard") { try { const w = JSON.parse(sessionStorage.getItem("wizardBuild") || "null"); if (w) { build.hero_id = w.hero_id; build.title = w.title || ""; const byTier = (lo, hi) => w.order.filter((i) => i.tier >= lo && i.tier <= hi).map((i) => ({ ability_id: i.item_id, annotation: null })); build.details.mod_categories[0].mods = byTier(1, 1); build.details.mod_categories[1].mods = byTier(2, 2); build.details.mod_categories[2].mods = byTier(3, 4); } } catch {} }
if (!id && qs.get("item") && item(+qs.get("item"))) build.details.mod_categories[0].mods.push({ ability_id: +qs.get("item"), annotation: null });
$("#hero").value = build.hero_id; $("#title").value = build.title; $("#desc").value = build.description || "";
if (id) { $("#owner").textContent = mine ? "Your build." : `By ${build.author_name ?? build.author}. You can view it, or fork a copy to edit.`; $("#fork").hidden = false; $("#del").hidden = !mine; $("#save").hidden = !mine; }
if (!me.account_id) $("#owner").textContent = "Sign in through Steam (top right) to save builds.";
function render() { $("#phases").replaceChildren(...build.details.mod_categories.map((cat, ci) => h("div", { class: "card phase" },
  h("h3", { onclick: () => { target = ci; render(); } }, h("span", {}, target === ci ? "+ " : ""), mine || !id ? h("input", { type: "text", value: cat.name, onchange: (e) => (cat.name = e.target.value), onclick: (e) => e.stopPropagation() }) : cat.name),
  h("div", { class: "mods" }, ...cat.mods.map((m, mi) => h("div", { class: "mod" }, item(m.ability_id)?.image ? withTip(h("img", { src: item(m.ability_id).image, alt: item(m.ability_id).name }), item(m.ability_id)) : "", h("span", {}, item(m.ability_id)?.name ?? m.ability_id),
    h("input", { class: "note", placeholder: "note", value: m.annotation || "", onchange: (e) => (m.annotation = e.target.value || null) }),
    h("button", { title: "move left", onclick: () => { if (mi > 0) { [cat.mods[mi - 1], cat.mods[mi]] = [cat.mods[mi], cat.mods[mi - 1]]; render(); } } }, "‹"),
    h("button", { title: "move right", onclick: () => { if (mi < cat.mods.length - 1) { [cat.mods[mi + 1], cat.mods[mi]] = [cat.mods[mi], cat.mods[mi + 1]]; render(); } } }, "›"),
    h("button", { title: "remove", onclick: () => { cat.mods.splice(mi, 1); render(); } }, "×")))),
  h("div", { class: "muted", style: "font-size:12px;margin-top:6px" }, `${cat.mods.reduce((s, m) => s + (item(m.ability_id)?.cost || 0), 0).toLocaleString()} souls`)))); }
function renderPicker() { const q = $("#search").value.toLowerCase(), slot = document.querySelector('input[name=slot]:checked').value, heroId = +$("#hero").value;
  const rows = items.filter((i) => (!slot || i.slot === slot) && (!q || i.name.toLowerCase().includes(q)) && (!i.heroes?.length || i.heroes.includes(heroId))).sort((a, b) => (a.slot ?? "").localeCompare(b.slot ?? "") || a.tier - b.tier || a.name.localeCompare(b.name));
  $("#items").replaceChildren(...rows.map((i) => withTip(h("div", { class: "pick", onclick: () => { build.details.mod_categories[target].mods.push({ ability_id: i.id, annotation: null }); render(); } }, i.image ? h("img", { src: i.image }) : "", h("span", {}, i.name, " ", h("span", { class: "chip " + i.slot, style: "font-size:10px;padding:0 5px" }, `T${i.tier}`)), h("span", { class: "cost" }, i.cost)), i))); }
$("#search").oninput = renderPicker; document.querySelectorAll('input[name=slot]').forEach((r) => (r.onchange = renderPicker)); $("#hero").onchange = renderPicker;
render(); renderPicker();
const payload = () => ({ hero_id: +$("#hero").value, title: $("#title").value, description: $("#desc").value, details: build.details });
$("#save").onclick = async () => { const msg = $("#msg"); try { if (id && mine) { await api(`/library/${id}`, { method: "PUT", body: payload() }); msg.className = "ok"; msg.textContent = "Saved."; } else { const r = await api("/library", { method: "POST", body: payload() }); location.href = `/editor.html?id=${r.id}`; } } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
$("#fork").onclick = async () => { const msg = $("#msg"); try { const r = await api("/library", { method: "POST", body: { ...payload(), title: `${$("#title").value} (fork)`, forked_from: +id } }); location.href = `/editor.html?id=${r.id}`; } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
$("#del").onclick = async () => { if (confirm("Delete this build?")) { await api(`/library/${id}`, { method: "DELETE" }); location.href = "/library.html"; } };
</script></body></html>
