<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heatmap · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/app.css">
<style>
main{max-width:1300px}.lay{display:grid;grid-template-columns:260px 1fr;gap:18px}@media(max-width:900px){.lay{grid-template-columns:1fr}.lay>div:last-child{order:-1}.hp{max-height:220px}}
.side .card{margin:0 0 12px}.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{flex:1}.seg button.primary{font-weight:700}
.hp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-height:400px;overflow:auto;padding:2px 6px 2px 2px;scrollbar-width:thin}.hp .hpc{position:relative;aspect-ratio:1;min-width:0;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.75;background:#0a0b0f;transition:opacity .15s,transform .15s,border-color .15s;display:grid;place-items:center;font:600 11px var(--fh);color:var(--muted)}.hp .hpc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}.hp .hpc.on,.hp .hpc:hover{border-color:var(--accent);opacity:1;transform:scale(1.06)}.hp .hpc.on{box-shadow:0 0 0 2px rgba(232,199,106,.35),0 6px 16px rgba(0,0,0,.6)}
.mapwrap{position:relative;background:#0a0b0f;border-radius:50%;aspect-ratio:1;max-width:820px;margin:0 auto}.mapwrap canvas{width:100%;height:100%;border-radius:50%;transition:opacity .3s}.mapwrap.busy canvas{opacity:.55}.status{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(10,11,15,.85);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--cream);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px);z-index:2}.status.err{color:var(--loss);border-color:rgba(229,87,79,.5)}.status .sp{display:inline-block;width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
.legend{display:flex;gap:16px;justify-content:center;color:var(--muted);font-size:12px;margin-top:8px}.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
.sel{display:flex;gap:12px;align-items:center;margin-bottom:10px;min-height:58px}.sel img{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line2)}.sel strong{font:600 17px var(--fh);color:var(--cream)}
</style></head>
<body><main>
<h1>Danger zones</h1><p class="muted">Where a hero gets kills and where they die, from every tracked match in the window. Not a prediction — a map of what actually happens.</p>
<div class="lay"><div class="side">
<div class="card"><div class="sel" id="sel"><strong>All heroes</strong></div><input type="text" id="q" placeholder="Filter heroes…" style="width:100%;margin-bottom:6px"><div id="hp" class="hp"></div><p style="margin:8px 0 0"><button id="clear">All heroes</button></p></div>
<div class="card"><strong>Show</strong><div class="seg" style="margin-top:6px"><button data-mode="deaths" class="primary">Deaths</button><button data-mode="kills">Kills</button><button data-mode="net">Net</button></div>
<div style="margin-top:12px"><strong>Window</strong><div class="seg" style="margin-top:6px"><button data-days="7">7d</button><button data-days="30" class="primary">30d</button><button data-days="0">All</button></div></div>
<div style="margin-top:12px"><strong>Who</strong><div class="seg" style="margin-top:6px"><button data-who="all" class="primary">Everyone</button><button data-who="squad">Just the squad</button></div></div>
<div style="margin-top:12px"><strong>Game phase</strong><div class="seg" style="margin-top:6px"><button data-max="0" class="primary">Whole</button><button data-max="600">0–10m</button><button data-max="1200">0–20m</button></div></div>
<details style="margin-top:12px"><summary class="muted">Calibration</summary>
<div class="slider"><label>Extent</label><input type="range" id="calExt" min="8000" max="14000" step="64" value="10752"><span id="calExtV">10752</span></div>
<div class="slider"><label>Offset X</label><input type="range" id="calOx" min="-2000" max="2000" step="32" value="0"><span id="calOxV">0</span></div>
<div class="slider"><label>Offset Y</label><input type="range" id="calOy" min="-2000" max="2000" step="32" value="0"><span id="calOyV">0</span></div>
<label><input type="checkbox" id="calFlip" checked> Flip Y</label> <label><input type="checkbox" id="calSwap"> Swap</label> <label><input type="checkbox" id="calFlipX"> Flip X</label></details></div>
</div>
<div><div class="mapwrap" id="mapwrap"><div class="status" id="status" hidden></div><canvas id="map" width="1024" height="1024"></canvas></div><div class="legend"><span><i style="background:rgba(217,85,79,.9)"></i>deaths</span><span><i style="background:rgba(95,191,122,.9)"></i>kills</span><span><i style="background:#e4b94f"></i>Amber objectives</span><span><i style="background:#4ab3ff"></i>Sapphire objectives</span></div><p id="note" class="muted" style="text-align:center"></p></div></div>
</main>
<script type="module">
import { api, h, $, heroes, shell, showError } from "/js/app.js";
shell("/heatmap.html");
const [hs, assets] = await Promise.all([heroes(), api("/assets")]);
const state = { hero: +new URLSearchParams(location.search).get("hero") || 0, mode: "deaths", days: 30, max: 0, who: "all" };
const bg = new Image(); bg.crossOrigin = "anonymous"; bg.src = assets.map.images.minimap; const frame = new Image(); frame.crossOrigin = "anonymous"; frame.src = assets.map.images.frame;
const cal = () => ({ ext: +$("#calExt").value, ox: +$("#calOx").value, oy: +$("#calOy").value, flipY: $("#calFlip").checked, flipX: $("#calFlipX").checked, swap: $("#calSwap").checked });
for (const id of ["calExt", "calOx", "calOy"]) $("#" + id).oninput = (e) => { $("#" + id + "V").textContent = e.target.value; paint(); };
for (const id of ["calFlip", "calSwap", "calFlipX"]) $("#" + id).onchange = paint;
function renderPicker() { const q = $("#q").value.toLowerCase(); $("#hp").replaceChildren(...hs.filter((x) => !q || x.name.toLowerCase().includes(q)).map((x) => { const src = x.images.icon || x.images.card; return h("div", { class: "hpc" + (state.hero === x.id ? " on" : ""), title: x.name, onclick: () => { state.hero = x.id; renderSel(); renderPicker(); load(); } }, src ? h("img", { src, alt: x.name, loading: "lazy", onerror: (e) => e.target.replaceWith(x.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2)) }) : x.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2)); })); }
function renderSel() { const x = hs.find((y) => y.id === state.hero); $("#sel").replaceChildren(...(x ? [x.images.card || x.images.icon ? h("img", { src: x.images.card || x.images.icon, alt: "", onerror: (e) => e.target.remove() }) : "", h("div", {}, h("strong", {}, x.name), h("div", { class: "muted", style: "font-size:12px" }, h("a", { href: `/hero.html?id=${x.id}` }, "hero page")))] : [h("strong", {}, "All heroes"), h("span", { class: "muted", style: "font-size:12px" }, "pick one below to isolate")])); }
document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { state.mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach((x) => (x.className = x === b ? "primary" : "")); paint(); }));
document.querySelectorAll("[data-days]").forEach((b) => (b.onclick = () => { state.days = +b.dataset.days; document.querySelectorAll("[data-days]").forEach((x) => (x.className = x === b ? "primary" : "")); load(); }));
document.querySelectorAll("[data-who]").forEach((b) => (b.onclick = () => { state.who = b.dataset.who; document.querySelectorAll("[data-who]").forEach((x) => (x.className = x === b ? "primary" : "")); load(); }));
document.querySelectorAll("[data-max]").forEach((b) => (b.onclick = () => { state.max = +b.dataset.max; document.querySelectorAll("[data-max]").forEach((x) => (x.className = x === b ? "primary" : "")); load(); }));
$("#clear").onclick = () => { state.hero = 0; renderSel(); renderPicker(); load(); }; $("#q").oninput = renderPicker;
let seq = 0, squadIds = null;
const UP = "https://api.deadlock-api.com/v1/analytics/kill-death-stats";
/** Raw kill/death cells. Fetched straight from deadlock-api.com (CORS-open) so the 2–3 MB payload never passes through the Worker; falls back to our proxy. */
async function cells(q) {
  if (q.get("squad") === "1") { squadIds ??= (await api("/players")).map((p) => p.account_id).join(","); q.delete("squad"); if (squadIds) q.set("account_ids", squadIds); }
  try { const r = await fetch(`${UP}?${q}`, { signal: AbortSignal.timeout(25000) }); if (!r.ok) throw new Error(`upstream ${r.status}`); return merge(await r.json()); }
  catch (e) { console.warn("direct heatmap fetch failed, using proxy:", e.message); const d = await api(`/analytics/heatmap?${q}`); return d; }
}
function merge(raw) { const m = new Map(); let maxK = 0, maxD = 0; for (const c of raw) { const k = c.position_x + ":" + c.position_y; const o = m.get(k) ?? { x: c.position_x, y: c.position_y, kills: 0, deaths: 0 }; o.kills += c.kills; o.deaths += c.deaths; m.set(k, o); }
  for (const o of m.values()) { maxK = Math.max(maxK, o.kills); maxD = Math.max(maxD, o.deaths); } return { step: 128, maxKills: maxK, maxDeaths: maxD, cells: [...m.values()] }; }
const dataCache = new Map(); let current = null;
const status = (msg, err = false) => { const el = $("#status"); el.hidden = !msg; el.className = "status" + (err ? " err" : ""); el.replaceChildren(...(msg && !err ? [h("span", { class: "sp" }), msg] : [msg || ""])); $("#mapwrap").classList.toggle("busy", !!msg && !err); };
async function load() { const my = ++seq;
  const q = new URLSearchParams(); if (state.hero) q.set("hero_ids", state.hero); if (state.days) q.set("min_unix_timestamp", Math.floor(Date.now() / 3600000) * 3600 - state.days * 86400); if (state.max) q.set("max_game_time_s", state.max); if (state.who === "squad") q.set("squad", "1");
  const key = q.toString(); if (dataCache.has(key)) { current = dataCache.get(key); status(""); paint(); return; }
  current = null; paint(); status(state.hero ? `Pulling every ${hs.find((y) => y.id === state.hero)?.name} kill and death…` : "Pulling every kill and death…");
  try { const d = await cells(q); if (my !== seq) return; dataCache.set(key, d); current = d; status(""); paint(); }
  catch (e) { if (my === seq) { status("Couldn't load map data: " + e.message, true); $("#note").textContent = "deadlock-api.com didn't answer in time — try again in a moment."; } } }
function paint() { const c = $("#map").getContext("2d"), S = 1024; c.clearRect(0, 0, S, S); if (bg.complete && bg.naturalWidth) c.drawImage(bg, 0, 0, S, S);
  const d = current; if (d) { const k = cal(), span = 2 * k.ext, cell = Math.ceil(S * d.step / span) + 1;
    for (const p of d.cells) { const v = state.mode === "deaths" ? p.deaths / d.maxDeaths : state.mode === "kills" ? p.kills / d.maxKills : (p.kills - p.deaths) / Math.max(d.maxKills, d.maxDeaths); if (!v) continue;
      const a = 0.8 * Math.min(1, Math.abs(v) ** 0.75); c.fillStyle = (state.mode === "deaths" || (state.mode === "net" && v < 0)) ? `rgba(217,85,79,${a})` : `rgba(95,191,122,${a})`;
      let [wx, wy] = k.swap ? [p.y, p.x] : [p.x, p.y]; wx += k.ox; wy += k.oy; let px = (wx + k.ext) / span * S, py = (wy + k.ext) / span * S; if (k.flipY) py = S - py; if (k.flipX) px = S - px; c.fillRect(px, py, cell, cell); } }
  for (const [name, o] of Object.entries(assets.map.objectives || {})) { c.fillStyle = name.startsWith("team0") ? "#e4b94f" : "#4ab3ff"; c.strokeStyle = "#000"; c.lineWidth = 2; c.beginPath(); c.arc(o.left_relative * S, o.top_relative * S, name.includes("core") ? 12 : name.includes("titan") ? 9 : 6, 0, Math.PI * 2); c.fill(); c.stroke(); }
  if (frame.complete && frame.naturalWidth) c.drawImage(frame, 0, 0, S, S);
  if (!d) { $("#note").textContent = ""; return; }
  const tot = d.cells.reduce((s, p) => s + (state.mode === "kills" ? p.kills : p.deaths), 0); $("#note").textContent = `${tot.toLocaleString()} ${state.mode === "kills" ? "kills" : "deaths"} plotted${state.hero ? " for " + hs.find((y) => y.id === state.hero)?.name : ""}${state.days ? ` · last ${state.days} days` : ""}${state.max ? ` · first ${state.max / 60} min` : ""}${state.who === "squad" ? " · squad only" : ""}`; if (!d.cells.length) $("#note").textContent += " — no data for this filter yet"; }
bg.onload = paint; frame.onload = paint; renderSel(); renderPicker(); load();
</script></body></html>
