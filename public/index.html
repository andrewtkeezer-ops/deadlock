  background:linear-gradient(180deg,rgba(255,250,235,.6),rgba(201,176,120,.28)),repeating-linear-gradient(0deg,rgba(90,70,30,.035) 0 1px,transparent 1px 3px) #efe3c6;

<body><main>
<div class="hdr"><h1>Leaderboard</h1><span class="muted" id="count" style="align-self:flex-end;margin-bottom:28px"></span><select id="days" style="align-self:flex-end;margin-bottom:26px"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="3650">All time</option></select></div>

<div id="out" class="card">Loading…</div>
<div class="two"><div><h2>Squad duos <span class="muted" style="font:400 13px var(--fb);letter-spacing:0;text-transform:none">· who wins together</span></h2><div id="duos" class="card">Loading…</div></div><div><h2>Recent games</h2><div id="recent" class="card recent">Loading…</div></div></div>
</main>
<script type="module">
import { api, h, $, pct, ago, dur, fmt, heroes, hero, rankBadge, heroIcon, shell, showError, kda, ratio, kdOf, kdaOf, KD, KDA } from "/js/app.js";

        h("td", { class: "num" }, p.games ? ratio(kdOf(p.kills, p.deaths), KD) : "–"),
        h("td", { class: "num" }, p.games ? ratio(kdaOf(p.kills, p.deaths, p.assists), KDA) : "–"),
        h("td", { class: "num" }, fmt(p.souls_per_min)),
        h("td", { class: "muted", title: p.last_sync_at ? `Synced ${ago(p.last_sync_at)}` : "Never synced" }, ago(p.last_played)));
    }));
    out.replaceChildren(h("table", { class: "lb" }, h("thead", {}, h("tr", {}, ...["#", "Player", "Rank", "Games", "Win rate", "Avg K / D / A", "KD", "KDA", "Souls/min", "Last played"].map((t) => h("th", {}, t)))), h("tbody", {}, ...rows)),
      h("div", { class: "lg-key" }, h("span", {}, h("i", { style: "background:var(--accent)" }), "kills"), h("span", {}, h("i", { style: "background:var(--loss)" }), "deaths"), h("span", {}, h("i", { style: "background:var(--sapph)" }), "assists"), h("span", { style: "margin-left:auto" }, "KD = kills ÷ deaths · KDA = (kills + assists) ÷ deaths")));

$("#days").addEventListener("change", load); load();
(async () => { const el = $("#duos"); try { const [duos, list] = await Promise.all([api("/players/duos"), api("/players")]); const P = new Map(list.map((p) => [p.account_id, p]));

  el.replaceChildren(...rows.map((d) => { const a = P.get(d.a), b = P.get(d.b), wr = d.wins / d.games; return h("div", { class: "duo" }, h("div", { class: "avs" }, a?.avatar_url ? h("img", { src: a.avatar_url, alt: "" }) : "", b?.avatar_url ? h("img", { src: b.avatar_url, alt: "" }) : ""),

(async () => {

        h("td", {}, h("div", { class: "hero" }, heroIcon(hx), h("a", { href: `/hero.html?id=${m.hero_id}` }, hx?.name ?? m.hero_id))),

        h("td", { class: "num" }, fmt(m.net_worth)), h("td", {}, dur(m.duration_s)), h("td", {}, h("a", { href: `/match.html?id=${m.match_id}` }, "scoreboard"))); }))));
  } catch (e) { showError(el, e); }
})();
