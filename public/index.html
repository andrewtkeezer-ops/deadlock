<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/icon.png"><link rel="stylesheet" href="/css/app.css">
<style>
.lb td{vertical-align:middle}.lb .p{display:flex;align-items:center;gap:10px}.lb .p img.av{width:36px;height:36px;border-radius:50%}.lb .pos{font-family:var(--fh);font-size:20px;color:var(--muted);width:30px}
.lb tr:first-child .pos{color:var(--accent)}.lb .wr{min-width:120px}.lb .wr .bar{margin-top:4px}.lb .streak{font-size:12px;color:var(--muted)}
.recent .hero{display:flex;align-items:center;gap:8px}.recent .items img{width:22px;height:22px}
.hdr{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.hdr select{margin-left:auto}
.two{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:0 18px}@media(max-width:1100px){.two{grid-template-columns:1fr}}.duo{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line2)}.duo:last-child{border-bottom:0}.duo .avs{display:flex}.duo .avs img{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel)}.duo .avs img+img{margin-left:-10px}.duo .nm{flex:1;font-size:13px;line-height:1.25}.duo .nm small{display:block;color:var(--muted);font-size:11px}.duo .wr{font:600 16px var(--fh);min-width:52px;text-align:right}.duo .bar{width:70px;height:5px}
.wire{position:relative;overflow:hidden;margin:4px 0 10px;padding:8px 0;border-top:2px dotted var(--line2);border-bottom:2px dotted var(--line2);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}.wire .track{display:flex;gap:44px;width:max-content;animation:wire var(--dur,60s) linear infinite;will-change:transform}.wire:hover .track{animation-play-state:paused}.wire .w{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--fh);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}.wire .w img{width:20px;height:20px;border-radius:5px}.wire .w b{color:var(--cream)}.wire .w .res{padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.06)}.wire .w .res.win{color:var(--win)}.wire .w .res.loss{color:var(--loss)}.wire .w a{color:inherit}.wire .w a:hover{color:var(--accent)}
@keyframes wire{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.wire .track{animation:none}}
.pd{animation:podIn .9s var(--snap) backwards}.pd:nth-child(1){animation-delay:.15s}.pd:nth-child(2){animation-delay:.3s}.pd:nth-child(3){animation-delay:.05s}@keyframes podIn{0%{opacity:0;transform:translateY(-60px) rotate(calc(var(--tilt) - 8deg)) scale(1.06)}60%{opacity:1;transform:translateY(8px) rotate(calc(var(--tilt) + 1deg))}100%{opacity:1;transform:rotate(var(--tilt))}}
.empty{text-align:center;padding:40px 20px}.empty p{color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:22px;align-items:end;margin:26px auto 18px;padding:0 10px;max-width:880px}@media(max-width:860px){.podium{grid-template-columns:1fr 1.12fr 1fr;gap:8px;padding:0;margin:14px 0 12px}.pd{padding:8px 8px 10px}.pd .photo{height:84px}.pd.first .photo{height:100px}.pd .n{font-size:14px;margin:8px 0 2px}.pd .r{font-size:9px;gap:5px}.pd .r img{height:16px}.pd .kv{gap:8px;margin-top:8px;padding-top:6px}.pd .kv b{font-size:14px}.pd .kv span{font-size:7px;letter-spacing:.1em}.pd .kv>div:nth-child(n+3){display:none}.pd .pos .sticker{font-size:10px;padding:5px 8px 4px}.pd .pos{top:-8px;left:-6px}.pd{min-width:0;--tilt:0deg}.pd .kv{flex-wrap:wrap}.pd .kv>div{min-width:0}.podium{grid-template-columns:1fr 1.1fr 1fr}}
.pd{--tilt:0deg;position:relative;text-align:center;padding:14px 14px 18px;background:var(--paper2);color:#1d1510;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.08);transform:rotate(var(--tilt));transition:transform .35s var(--snap),box-shadow .3s}
.pd:nth-child(1){--tilt:-2.2deg}.pd:nth-child(3){--tilt:2deg}.pd:hover{transform:rotate(0) translateY(-6px) scale(1.03);box-shadow:0 28px 60px rgba(0,0,0,.7)}
.pd .photo{position:relative;height:150px;background:#111 center/cover no-repeat;border-radius:2px;overflow:hidden;filter:saturate(.9) contrast(1.05)}.pd .photo img{width:100%;height:100%;object-fit:cover;display:block}.pd .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.45));mix-blend-mode:multiply}
.pd .pos{position:absolute;top:-12px;left:-10px;z-index:2}.pd .pos .sticker{font-size:14px;padding:8px 12px 7px}
.pd.first .pos .sticker{background:var(--accent);color:#1a1200}
.pd .n{font:600 20px/1.1 var(--fh);margin:12px 0 2px;letter-spacing:.02em;color:#1d1510}.pd .r{display:flex;justify-content:center;align-items:center;gap:8px;color:rgba(29,21,16,.6);font:600 11px/1 var(--fh);letter-spacing:.14em;text-transform:uppercase}
.pd .kv{display:flex;justify-content:center;gap:18px;margin-top:12px;padding-top:10px;border-top:2px dotted rgba(29,21,16,.2)}.pd .kv b{font:600 20px/1 var(--fh);display:block}.pd .kv span{font:600 9px/1 var(--fh);letter-spacing:.16em;text-transform:uppercase;color:rgba(29,21,16,.55);display:block;margin-top:5px}
.pd .kv .win{color:#2f7d3e}.pd .kv .loss{color:#b9321f}.pd,.pd:hover,.pd .kv b{color:#1d1510}
.pd.first{padding-top:16px}.pd.first .photo{height:180px}.pd.first .photo{outline:3px solid var(--accent);outline-offset:-3px}
.lb .pos{font:600 18px var(--fh);color:var(--muted);width:30px}.lb tr:first-child .pos{color:var(--accent)}
</style></head>
<body><main>
<div class="hdr"><h1>Leaderboard</h1><span class="muted" id="count" style="align-self:flex-end;margin-bottom:28px"></span><select id="days" style="align-self:flex-end;margin-bottom:26px"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="3650">All time</option></select></div>
<div class="wire" id="wire" hidden><div class="track" id="wireTrack"></div></div>
<div id="podium" class="podium"></div>
<div id="out" class="card">Loading…</div>
<div class="two"><div><h2>Squad duos <span class="muted" style="font:400 13px var(--fb);letter-spacing:0;text-transform:none">· who wins together</span></h2><div id="duos" class="card">Loading…</div></div><div><h2>Recent games</h2><div id="recent" class="card recent">Loading…</div></div></div>
</main>
<script type="module">
import { api, h, $, pct, ago, dur, fmt, heroes, hero, rankBadge, heroIcon, shell, showError, kda, ratio, kdOf, kdaOf, KD, KDA } from "/js/app.js";
shell("/");
async function load() {
  const out = $("#out");
  try {
    const [{ players }, hs] = await Promise.all([api(`/players/leaderboard?days=${$("#days").value}`), heroes()]);
    $("#count").textContent = players.length ? `${players.length} tracked` : "";
    if (!players.length) return out.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Nobody here yet"), h("p", {}, "Sign in through Steam to add yourself, then install the uploader so your games flow in."), h("a", { class: "dl", href: "/api/auth/steam/login" }, "Sign in through Steam")));
    const top = players.slice(0, 3); const order = top.length === 3 ? [top[1], top[0], top[2]] : top;
    $("#podium").replaceChildren(...await Promise.all(order.map(async (p) => { const i = players.indexOf(p); const wr = p.games ? p.wins / p.games : null; return h("a", { class: "pd" + (i === 0 ? " first" : ""), href: `/player.html?id=${p.account_id}` }, h("span", { class: "pos" }, h("span", { class: "sticker" + (i === 2 ? " r" : "") }, `#${i + 1}`)), h("div", { class: "photo" }, p.avatar_url ? h("img", { src: p.avatar_url, alt: "" }) : ""), h("div", { class: "n" }, p.name), h("div", { class: "r" }, await rankBadge(p.mmr_rank), p.mmr_score != null ? String(Math.round(p.mmr_score)) : ""),
      h("div", { class: "kv" }, h("div", {}, h("b", { class: wr == null ? "" : wr >= .5 ? "win" : "loss" }, wr == null ? "–" : pct(wr)), h("span", {}, "win rate")), h("div", {}, h("b", { class: kdaOf(p.kills, p.deaths, p.assists) >= KDA.good ? "win" : kdaOf(p.kills, p.deaths, p.assists) < KDA.even ? "loss" : "" }, p.games ? kdaOf(p.kills, p.deaths, p.assists).toFixed(2) : "–"), h("span", {}, "kda")), h("div", {}, h("b", {}, String(p.games)), h("span", {}, "games")), h("div", {}, h("b", {}, fmt(p.souls_per_min)), h("span", {}, "spm")))); })));
    const rows = await Promise.all(players.map(async (p, i) => {
      const wr = p.games ? p.wins / p.games : null;
      return h("tr", {}, h("td", { class: "pos" }, String(i + 1)),
        h("td", {}, h("div", { class: "p" }, p.avatar_url ? h("img", { class: "av", src: p.avatar_url, alt: "" }) : "", h("a", { href: `/player.html?id=${p.account_id}` }, p.name))),
        h("td", {}, await rankBadge(p.mmr_rank), " ", h("span", { class: "muted" }, p.mmr_score != null ? `${Math.round(p.mmr_score)}` : "")),
        h("td", { class: "num" }, String(p.games)),
        h("td", { class: "wr" }, wr == null ? "–" : [h("span", { class: wr >= .5 ? "win" : "loss" }, pct(wr)), h("div", { class: "bar" }, h("i", { style: `width:${wr * 100}%;background:${wr >= .5 ? "var(--win)" : "var(--loss)"}` }))]),
        h("td", {}, p.games ? kda(p.avg_kills, p.avg_deaths, p.avg_assists, { dec: 1 }) : h("span", { class: "muted" }, "–")),
        h("td", { class: "num" }, p.games ? ratio(kdOf(p.kills, p.deaths), KD) : "–"),
        h("td", { class: "num" }, p.games ? ratio(kdaOf(p.kills, p.deaths, p.assists), KDA) : "–"),
        h("td", { class: "num" }, fmt(p.souls_per_min)),
        h("td", { class: "muted", title: p.last_sync_at ? `Synced ${ago(p.last_sync_at)}` : "Never synced" }, ago(p.last_played)));
    }));
    out.replaceChildren(h("table", { class: "lb" }, h("thead", {}, h("tr", {}, ...["#", "Player", "Rank", "Games", "Win rate", "Avg K / D / A", "KD", "KDA", "Souls/min", "Last played"].map((t) => h("th", {}, t)))), h("tbody", {}, ...rows)),
      h("div", { class: "lg-key" }, h("span", {}, h("i", { style: "background:var(--accent)" }), "kills"), h("span", {}, h("i", { style: "background:var(--loss)" }), "deaths"), h("span", {}, h("i", { style: "background:var(--sapph)" }), "assists"), h("span", { style: "margin-left:auto" }, "KD = kills ÷ deaths · KDA = (kills + assists) ÷ deaths")));
  } catch (e) { showError(out, e); }
}
$("#days").addEventListener("change", load); load();
(async () => { const el = $("#duos"); try { const [duos, list] = await Promise.all([api("/players/duos"), api("/players")]); const P = new Map(list.map((p) => [p.account_id, p]));
  const rows = duos.filter((d) => d.games >= 2).slice(0, 10);
  if (!rows.length) return el.replaceChildren(h("p", { class: "muted", style: "margin:0" }, "No shared games yet. Once two tracked friends play on the same team, their duo shows up here."));
  el.replaceChildren(...rows.map((d) => { const a = P.get(d.a), b = P.get(d.b), wr = d.wins / d.games; return h("div", { class: "duo" }, h("div", { class: "avs" }, a?.avatar_url ? h("img", { src: a.avatar_url, alt: "" }) : "", b?.avatar_url ? h("img", { src: b.avatar_url, alt: "" }) : ""),
    h("div", { class: "nm" }, `${a?.name ?? d.a} + ${b?.name ?? d.b}`, h("small", {}, `${d.games} games together · ${d.kills.toFixed(0)}/${d.deaths.toFixed(0)}/${d.assists.toFixed(0)} combined`)), h("div", {}, h("div", { class: "wr " + (wr >= .5 ? "win" : "loss") }, pct(wr)), h("div", { class: "bar" }, h("i", { style: `width:${wr * 100}%;background:${wr >= .5 ? "var(--win)" : "var(--loss)"}` })))); })); } catch (e) { showError(el, e); } })();
(async () => {
  const el = $("#recent");
  try {
    const [list, hs] = await Promise.all([api("/players"), heroes()]);
    if (!list.length) return (el.textContent = "No games yet.");
    const all = (await Promise.all(list.map((p) => api(`/players/${p.account_id}`).then((d) => d.matches.slice(0, 10).map((m) => ({ ...m, player: p })))))).flat().sort((a, b) => b.start_time - a.start_time).slice(0, 25);
    // the wire: a slow ticker of the latest results
    const wireItems = all.slice(0, 12).map((m) => { const hx = hs.find((x) => x.id === m.hero_id); return h("span", { class: "w" }, heroIcon(hx, 20), h("a", { href: `/player.html?id=${m.player.account_id}` }, h("b", {}, m.player.name)), h("span", { class: "res " + (m.won ? "win" : "loss") }, m.won ? "Win" : "Loss"), `${hx?.name ?? ""} ${m.kills}/${m.deaths}/${m.assists}`, h("span", { style: "color:var(--dim)" }, ago(m.start_time))); });
    if (wireItems.length) { $("#wire").hidden = false; $("#wireTrack").replaceChildren(...wireItems, ...wireItems.map((x) => x.cloneNode(true))); $("#wire").style.setProperty("--dur", `${Math.max(30, wireItems.length * 6)}s`); }
    el.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ...["When", "Player", "Hero", "Result", "K / D / A", "KDA", "Souls", "Length", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, ...all.map((m) => { const hx = hs.find((x) => x.id === m.hero_id); return h("tr", {}, h("td", { class: "muted" }, ago(m.start_time)), h("td", {}, h("a", { href: `/player.html?id=${m.player.account_id}` }, m.player.name)),
        h("td", {}, h("div", { class: "hero" }, heroIcon(hx), h("a", { href: `/hero.html?id=${m.hero_id}` }, hx?.name ?? m.hero_id))),
        h("td", { class: m.won ? "win" : "loss" }, m.won ? "Win" : "Loss"), h("td", {}, kda(m.kills, m.deaths, m.assists, { size: "sm" })), h("td", { class: "num" }, ratio(kdaOf(m.kills, m.deaths, m.assists), KDA)),
        h("td", { class: "num" }, fmt(m.net_worth)), h("td", {}, dur(m.duration_s)), h("td", {}, h("a", { href: `/match.html?id=${m.match_id}` }, "scoreboard"))); }))));
  } catch (e) { showError(el, e); }
})();
</script></body></html>
