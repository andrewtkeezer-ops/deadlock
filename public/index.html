<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/icon.png"><link rel="stylesheet" href="/css/app.css">
<style>
.lb td{vertical-align:middle}.lb .p{display:flex;align-items:center;gap:10px}.lb .p img.av{width:36px;height:36px;border-radius:50%}.lb .pos{font-family:Reaver;font-size:20px;color:var(--muted);width:30px}
.lb tr:first-child .pos{color:var(--accent)}.lb .wr{min-width:120px}.lb .wr .bar{margin-top:4px}.lb .streak{font-size:12px;color:var(--muted)}
.recent .hero{display:flex;align-items:center;gap:8px}.recent .items img{width:22px;height:22px}
.hdr{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}.hdr select{margin-left:auto}
.empty{text-align:center;padding:40px 20px}.empty p{color:var(--muted)}
</style></head>
<body><main>
<div class="hdr"><h1>Leaderboard</h1><span class="muted" id="count"></span><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="3650">All time</option></select></div>
<div id="out" class="card">Loading…</div>
<h2>Recent games</h2><div id="recent" class="card recent">Loading…</div>
</main>
<script type="module">
import { api, h, $, pct, ago, dur, fmt, heroes, hero, rankBadge, heroIcon, shell, showError } from "/js/app.js";
shell("/");
async function load() {
  const out = $("#out");
  try {
    const [{ players }, hs] = await Promise.all([api(`/players/leaderboard?days=${$("#days").value}`), heroes()]);
    $("#count").textContent = players.length ? `${players.length} tracked` : "";
    if (!players.length) return out.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Nobody here yet"), h("p", {}, "Sign in through Steam to add yourself, then install the uploader so your games flow in."), h("a", { class: "dl", href: "/api/auth/steam/login" }, "Sign in through Steam")));
    const rows = await Promise.all(players.map(async (p, i) => {
      const wr = p.games ? p.wins / p.games : null;
      return h("tr", {}, h("td", { class: "pos" }, String(i + 1)),
        h("td", {}, h("div", { class: "p" }, p.avatar_url ? h("img", { class: "av", src: p.avatar_url, alt: "" }) : "", h("a", { href: `/player.html?id=${p.account_id}` }, p.name))),
        h("td", {}, await rankBadge(p.mmr_rank), " ", h("span", { class: "muted" }, p.mmr_score != null ? `${Math.round(p.mmr_score)}` : "")),
        h("td", { class: "num" }, String(p.games)),
        h("td", { class: "wr" }, wr == null ? "–" : [h("span", { class: wr >= .5 ? "win" : "loss" }, pct(wr)), h("div", { class: "bar" }, h("i", { style: `width:${wr * 100}%;background:${wr >= .5 ? "var(--win)" : "var(--loss)"}` }))]),
        h("td", { class: "num" }, `${p.avg_kills.toFixed(1)} / ${p.avg_deaths.toFixed(1)} / ${p.avg_assists.toFixed(1)}`),
        h("td", { class: "num" }, fmt(p.souls_per_min)),
        h("td", { class: "muted" }, ago(p.last_played)), h("td", { class: "muted" }, p.last_sync_at ? ago(p.last_sync_at) : "never"));
    }));
    out.replaceChildren(h("table", { class: "lb" }, h("thead", {}, h("tr", {}, ...["#", "Player", "Rank", "Games", "Win rate", "K / D / A", "Souls/min", "Last played", "Synced"].map((t) => h("th", {}, t)))), h("tbody", {}, ...rows)));
  } catch (e) { showError(out, e); }
}
$("#days").addEventListener("change", load); load();
(async () => {
  const el = $("#recent");
  try {
    const [list, hs] = await Promise.all([api("/players"), heroes()]);
    if (!list.length) return (el.textContent = "No games yet.");
    const all = (await Promise.all(list.map((p) => api(`/players/${p.account_id}`).then((d) => d.matches.slice(0, 10).map((m) => ({ ...m, player: p })))))).flat().sort((a, b) => b.start_time - a.start_time).slice(0, 25);
    el.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ...["When", "Player", "Hero", "Result", "K/D/A", "Souls", "Length", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, ...all.map((m) => { const hx = hs.find((x) => x.id === m.hero_id); return h("tr", {}, h("td", { class: "muted" }, ago(m.start_time)), h("td", {}, h("a", { href: `/player.html?id=${m.player.account_id}` }, m.player.name)),
        h("td", {}, h("div", { class: "hero" }, heroIcon(hx), h("a", { href: `/hero.html?id=${m.hero_id}` }, hx?.name ?? m.hero_id))),
        h("td", { class: m.won ? "win" : "loss" }, m.won ? "Win" : "Loss"), h("td", { class: "num" }, `${m.kills}/${m.deaths}/${m.assists}`),
        h("td", { class: "num" }, fmt(m.net_worth)), h("td", {}, dur(m.duration_s)), h("td", {}, h("a", { href: `/match.html?id=${m.match_id}` }, "scoreboard"))); }))));
  } catch (e) { showError(el, e); }
})();
</script></body></html>
