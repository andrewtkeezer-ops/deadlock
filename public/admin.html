<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Deadlock Squad</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main><h1>Squad admin</h1><p id="who" class="muted"></p>
<div class="card"><h2 style="margin-top:0">Invite someone</h2>
<p>They sign in with the Google account you invite, and they're in. Optionally link their Steam account_id so their stats show on their profile.</p>
<input type="text" id="email" placeholder="friend@gmail.com" style="width:260px"> <select id="role"><option value="member">Member</option><option value="admin">Admin</option></select> <input type="number" id="acc" placeholder="account_id (optional)" style="width:180px"> <button class="primary" id="invite">Invite</button> <span id="msg"></span></div>
<div class="card"><h2 style="margin-top:0">Members</h2><div id="members">Loading…</div></div>
<div class="card"><h2 style="margin-top:0">Tracked players</h2><p>Add a Steam account to the leaderboard (see <a href="/setup.html">Setup</a> for how to find the id).</p>
<input type="number" id="pacc" placeholder="account_id" style="width:160px"> <input type="text" id="pname" placeholder="Display name"> <button class="primary" id="padd">Add &amp; import</button> <button id="sync">Sync everyone now</button> <span id="pmsg"></span><div id="players" style="margin-top:12px"></div></div></main>
<script type="module">
import { api, h, $, ago, shell, showError } from "/js/app.js";
shell("/admin.html");
const me = await api("/me"); $("#who").textContent = me.unconfigured ? "Cloudflare Access not configured — running open (local dev)." : `Signed in as ${me.email} (${me.role})`;
async function members() { const el = $("#members"); try { const rows = await api("/admin/members");
  el.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ...["Email", "Role", "Steam id", "Invited by", "Last seen", ""].map((t) => h("th", {}, t)))), h("tbody", {}, ...rows.map((m) => h("tr", {}, h("td", {}, m.email), h("td", {}, m.role), h("td", {}, m.account_id ?? "–"), h("td", { class: "muted" }, m.invited_by ?? ""), h("td", { class: "muted" }, ago(m.last_seen)),
    h("td", {}, h("button", { onclick: async () => { if (confirm(`Remove ${m.email}?`)) { await api(`/admin/members/${encodeURIComponent(m.email)}`, { method: "DELETE" }); members(); } } }, "remove"))))))); } catch (e) { showError(el, e); } }
$("#invite").onclick = async () => { const msg = $("#msg"); try { await api("/admin/members", { method: "POST", body: { email: $("#email").value, role: $("#role").value, account_id: +$("#acc").value || undefined } }); msg.className = "ok"; msg.textContent = "Invited."; $("#email").value = ""; members(); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
async function players() { const el = $("#players"); try { const rows = await api("/players");
  el.replaceChildren(h("table", {}, h("tbody", {}, ...rows.map((p) => h("tr", {}, h("td", {}, p.name), h("td", {}, String(p.account_id)), h("td", { class: "muted" }, `synced ${ago(p.last_sync_at)}`),
    h("td", {}, h("button", { onclick: async () => { if (confirm(`Stop tracking ${p.name}?`)) { await api(`/admin/players/${p.account_id}`, { method: "DELETE" }); players(); } } }, "remove"))))))); } catch (e) { showError(el, e); } }
$("#padd").onclick = async () => { const msg = $("#pmsg"); msg.textContent = "Importing…"; try { const r = await api("/admin/players", { method: "POST", body: { account_id: +$("#pacc").value, name: $("#pname").value } }); msg.className = "ok"; msg.textContent = `Imported ${r.matchesImported} matches.`; players(); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
$("#sync").onclick = async () => { const msg = $("#pmsg"); msg.textContent = "Syncing…"; try { const r = await api("/admin/sync", { method: "POST" }); msg.className = r.errors.length ? "error" : "ok"; msg.textContent = `${r.newMatches} new matches across ${r.players} players. ${r.errors.join(" ")}`; players(); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
members(); players();
</script></body></html>
