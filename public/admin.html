<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/app.css">
<style>
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.pc{display:flex;gap:10px;align-items:center;background:#0f1118;border:1px solid var(--line);border-radius:10px;padding:10px}.pc img{width:44px;height:44px;border-radius:8px}.pc .n{flex:1;min-width:0}.pc .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .n small{color:var(--muted)}
.members td{vertical-align:middle}.members img{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
</style></head>
<body><main><h1>Admin</h1><p id="who" class="muted"></p>
<div class="card"><h2 style="margin-top:0">Add a player</h2>
<p><a href="/api/auth/steam/login"><img src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png" alt="Sign in through Steam" style="height:35px;vertical-align:middle"></a> <span class="muted" style="margin-left:10px">adds yourself. For someone else, search below.</span></p>
<p><input type="text" id="q" placeholder="Steam name, profile URL (/id/… or /profiles/…) or account id" style="width:320px"> <button class="primary" id="search">Search</button> <span id="pmsg"></span></p><div id="results" class="prof"></div></div>
<div class="cols">
<div class="card"><h2 style="margin-top:0">Tracked players</h2><p><button id="sync">Sync everyone now</button> <span id="smsg" class="muted"></span></p><div id="players"></div></div>
<div class="card"><h2 style="margin-top:0">Steam friends who play Deadlock</h2><p>Friends of <select id="friendsOf"></select> <button id="loadFriends">Load</button> <span class="muted" style="font-size:12px">(their Steam friends list must be public)</span></p><div id="friends" class="prof"></div></div>
</div>
<div class="card"><h2 style="margin-top:0">Google login members</h2><p class="muted" id="accessNote"></p>
<p><input type="text" id="email" placeholder="friend@gmail.com" style="width:260px"> <select id="role"><option value="member">Member</option><option value="admin">Admin</option></select> <input type="number" id="acc" placeholder="Steam account_id (optional)" style="width:200px"> <button class="primary" id="invite">Invite</button> <span id="msg"></span></p>
<div id="inviteOut" class="card" hidden style="margin:0 0 12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><strong id="ioTitle">Invite link</strong><code id="ioLink" style="flex:1;min-width:240px;overflow:auto;white-space:nowrap"></code><button id="ioCopyLink">Copy link</button><button id="ioCopyMsg">Copy message</button><a id="ioMail" class="btn" href="#">Open in email</a></div><p id="ioNote" class="muted" style="margin:8px 0 0;font-size:12px"></p></div>
<div id="members" class="members">Loading…</div></div>
</main>
<script type="module">
import { api, h, $, ago, me, rankBadge, shell, showError } from "/js/app.js";
shell("/admin.html");
const m = await me(); $("#who").textContent = m.unconfigured ? "Google sign-in is not configured yet (GOOGLE_CLIENT_ID): the site is open and everyone is an admin. Turn it on before sharing the link." : `Signed in as ${m.email} (${m.role})`;
$("#accessNote").textContent = m.unconfigured ? "Once Google sign-in is on, only invited Google accounts can open the site. Invites added now will apply then." : "Invited Google accounts can sign in. The super admin is always allowed.";
const card = (p, action) => h("div", { class: "pc" }, p.avatar || p.avatarmedium ? h("img", { src: p.avatarmedium || p.avatar, alt: "" }) : "", h("div", { class: "n" }, h("b", {}, p.personaname), h("small", {}, p.note ? p.note + " · " : `${p.matches_played_last_30d ?? 0} games / 30d · `, h("a", { href: p.profileurl || `https://steamcommunity.com/profiles/${BigInt(p.account_id) + 76561197960265728n}`, target: "_blank", rel: "noopener" }, "profile"))), action);
async function addPlayer(p, btn, msgEl) { btn.disabled = true; btn.textContent = "Importing…"; try { const r = await api("/admin/players", { method: "POST", body: { account_id: p.account_id, name: p.personaname, avatar_url: p.avatarmedium || p.avatar } }); btn.textContent = `Added (${r.matchesImported})`; players(); } catch (e) { btn.disabled = false; btn.textContent = "Add"; msgEl.className = "error"; msgEl.textContent = e.message; } }
$("#search").onclick = async () => { const msg = $("#pmsg"), el = $("#results"); msg.textContent = "Searching…"; msg.className = "muted"; try { const rows = await api(`/admin/steam-search?q=${encodeURIComponent($("#q").value)}`); msg.textContent = rows.length ? "" : "No profiles found. deadlock-api only knows players it has seen; the Steam sign-in button always works.";
  el.replaceChildren(...rows.map((p) => { const b = h("button", { class: "primary" }, "Add"); b.onclick = () => addPlayer(p, b, msg); return card(p, b); })); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#search").click(); });
async function players() { const el = $("#players"); try { const rows = await api("/players"); $("#friendsOf").replaceChildren(...rows.map((p) => new Option(p.name, p.account_id)));
  el.replaceChildren(rows.length ? h("table", {}, h("tbody", {}, ...await Promise.all(rows.map(async (p) => h("tr", {}, h("td", {}, p.avatar_url ? h("img", { src: p.avatar_url, width: 28, height: 28, style: "border-radius:50%;vertical-align:middle;margin-right:8px" }) : "", h("a", { href: `/player.html?id=${p.account_id}` }, p.name)), h("td", {}, await rankBadge(p.mmr_rank)), h("td", { class: "muted" }, `synced ${ago(p.last_sync_at)}`),
    h("td", {}, h("button", { onclick: async () => { if (confirm(`Stop tracking ${p.name}?`)) { await api(`/admin/players/${p.account_id}`, { method: "DELETE" }); players(); } } }, "remove"))))))) : h("p", { class: "muted" }, "Nobody yet.")); } catch (e) { showError(el, e); } }
$("#loadFriends").onclick = async () => { const el = $("#friends"); el.textContent = "Loading…"; try { const d = await api(`/admin/steam-friends/${$("#friendsOf").value}`); if (!d.friends.length) return (el.textContent = d.note || "No friends with recent Deadlock games.");
  el.replaceChildren(...d.friends.map((p) => { const b = h("button", { class: "primary" }, p.tracked ? "Tracked" : "Add"); if (p.tracked) b.disabled = true; else b.onclick = () => addPlayer(p, b, $("#pmsg")); return card(p, b); })); } catch (e) { showError(el, e); } };
$("#sync").onclick = async () => { const msg = $("#smsg"); msg.textContent = "Syncing…"; try { const r = await api("/admin/sync", { method: "POST" }); msg.className = r.errors.length ? "error" : "ok"; msg.textContent = `${r.newMatches} new matches across ${r.players} players. ${r.errors.join(" ")}`; players(); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
async function members() { const el = $("#members"); try { const rows = await api("/admin/members");
  el.replaceChildren(rows.length ? h("table", {}, h("thead", {}, h("tr", {}, ...["Email", "Role", "Steam id", "Invited by", "Status", ""].map((t) => h("th", {}, t)))), h("tbody", {}, ...rows.map((r) => h("tr", {}, h("td", {}, r.email), h("td", {}, r.role), h("td", {}, r.account_id ?? "–"), h("td", { class: "muted" }, r.invited_by ?? ""), h("td", { class: r.accepted_at ? "ok" : "muted" }, r.accepted_at ? `joined · seen ${ago(r.last_seen)}` : r.invite_sent_at ? "emailed, not yet joined" : "invited, not yet joined"),
    h("td", {}, h("button", { onclick: async () => { const rr = await api(`/admin/members/${encodeURIComponent(r.email)}/invite`, { method: "POST" }); showInvite(rr, r.email); } }, r.accepted_at ? "link" : "invite link"), " ", h("button", { onclick: async () => { if (confirm(`Remove ${r.email}?`)) { await api(`/admin/members/${encodeURIComponent(r.email)}`, { method: "DELETE" }); members(); } } }, "remove")))))) : h("p", { class: "muted" }, "No invites yet.")); } catch (e) { showError(el, e); } }
function showInvite(r, email) { const box = $("#inviteOut"); box.hidden = false; $("#ioTitle").textContent = r.emailed ? `Emailed ${email} — link for backup:` : `Invite link for ${email}:`; $("#ioLink").textContent = r.link;
  $("#ioCopyLink").onclick = () => navigator.clipboard.writeText(r.link).then(() => ($("#ioCopyLink").textContent = "Copied ✓")); $("#ioCopyMsg").onclick = () => navigator.clipboard.writeText(r.message).then(() => ($("#ioCopyMsg").textContent = "Copied ✓"));
  $("#ioMail").href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent("You're invited to Soul Scribe")}&body=${encodeURIComponent(r.message)}`;
  $("#ioNote").textContent = r.emailed ? "Sent through Resend." : "Email sending isn't set up yet (needs RESEND_API_KEY + INVITE_FROM), so share the link yourself — Discord, Steam chat, text, or the email button above. The link opens a styled invite page."; }
$("#invite").onclick = async () => { const msg = $("#msg"); const email = $("#email").value.trim(); try { const r = await api("/admin/members", { method: "POST", body: { email, role: $("#role").value, account_id: +$("#acc").value || undefined } }); msg.className = "ok"; msg.textContent = r.emailed ? "Invited and emailed." : "Invite created."; $("#email").value = ""; showInvite(r, email); members(); } catch (e) { msg.className = "error"; msg.textContent = e.message; } };
players(); members();
</script></body></html>
