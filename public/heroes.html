<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heroes · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/app.css">
<style>
main{max-width:1400px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0}.top .sp{flex:1}
.select{display:grid;grid-template-columns:minmax(360px,500px) 1fr;gap:24px}@media(max-width:900px){.select{grid-template-columns:1fr}}
.grid-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;align-content:start}
.hc{aspect-ratio:3/4;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;background:#0a0b0f;transition:transform .15s,border-color .15s,box-shadow .15s}
.hc img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}.hc:hover,.hc.active{transform:scale(1.07);border-color:var(--accent);z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.hc.locked{border-color:#fff;box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(228,185,79,.55)}.hc.locked::before{content:"🔒";position:absolute;top:3px;right:4px;font-size:11px;z-index:2;filter:drop-shadow(0 1px 2px #000)}
.hc .wr{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:8px 0 2px}
/* ---- stage ---- */
.stage{position:relative;border-radius:16px;overflow:hidden;min-height:560px;background:#0a0b0f;border:1px solid var(--line);isolation:isolate;--tint:#4174bb}
.stage .bg{position:absolute;inset:-4%;background:center/cover no-repeat;filter:blur(2px) saturate(1.15);opacity:.55;transform:scale(1.04);transition:opacity .35s}
.stage .tint{position:absolute;inset:0;background:radial-gradient(60% 80% at 80% 60%,color-mix(in srgb,var(--tint) 45%,transparent),transparent 70%),linear-gradient(90deg,rgba(14,15,19,.96) 0%,rgba(14,15,19,.75) 38%,rgba(14,15,19,.2) 70%,rgba(14,15,19,.05) 100%),linear-gradient(0deg,rgba(14,15,19,.9) 0%,transparent 35%)}
.stage .art{position:absolute;right:-2%;top:0;bottom:0;height:100%;max-width:62%;object-fit:contain;object-position:right bottom;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 100%),linear-gradient(0deg,transparent 0%,#000 18%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 100%);filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
.stage .sweep{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-120%);opacity:0}
.stage.in .art{animation:artIn .55s cubic-bezier(.2,.8,.2,1) both}.stage.in .info{animation:infoIn .45s .08s ease both}.stage.in .bg{animation:bgIn .6s ease both}.stage.in .sweep{animation:sweep .7s .15s ease-out both}
@keyframes artIn{from{opacity:0;transform:translateX(40px) scale(1.04);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes infoIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes bgIn{from{opacity:0}to{opacity:.55}}@keyframes sweep{0%{transform:translateX(-120%);opacity:1}100%{transform:translateX(120%);opacity:0}}
.stage .info{position:relative;z-index:3;padding:34px 36px;max-width:52%}@media(max-width:900px){.stage .info{max-width:100%;padding:22px}.stage .art{opacity:.3;max-width:100%}.stage{min-height:460px}}
.stage .name{height:66px;max-width:100%;filter:drop-shadow(0 2px 8px rgba(0,0,0,.9))}.stage h2.name{font-family:Reaver;font-size:48px;margin:0;text-transform:uppercase}
.tags{margin:10px 0 14px}.tag{display:inline-block;background:color-mix(in srgb,var(--tint) 70%,#1f6fd0);color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:3px;margin-right:6px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.stat{display:inline-block;margin-right:18px}.stat b{display:block;font-size:22px;font-family:Reaver}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase}
.abrow{display:flex;gap:10px;margin:12px 0}.abrow img{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:#000;box-shadow:0 4px 12px rgba(0,0,0,.6);transition:transform .15s,border-color .15s}.abrow img:hover{transform:scale(1.1);border-color:var(--accent)}
.stage p{line-height:1.5;color:#dcd9cf}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;font-weight:700;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);backdrop-filter:blur(6px);cursor:pointer;font-size:14px;text-decoration:none}.btn:hover{background:rgba(255,255,255,.12);text-decoration:none}.btn.primary{background:var(--accent);color:#1a1200;border-color:transparent}.btn.lock{margin-left:auto;padding:10px 12px}.btn.lock.on{background:rgba(228,185,79,.25);border-color:var(--accent);color:var(--accent)}
.meta-btn{margin-left:auto}
</style></head>
<body><main>
<div class="top"><h1>Select hero</h1><span class="muted">Hover to preview · click to lock · double-click to open</span><span class="sp"></span>
<select id="band"><option value="">All ranks</option><option value="1,60">Initiate–Arcanist</option><option value="61,90">Oracle–Phantom</option><option value="91,116">Ascendant–Eternus</option></select><button id="metaBtn">Meta table</button></div>
<div class="select" style="margin-top:14px"><div id="grid" class="grid-h"></div><div id="stage" class="stage"><div class="info muted" style="padding:36px">Loading heroes…</div></div></div>
</main>
<script type="module">
import { api, h, $, pct, heroes, abilityTooltip, withTipBuilder, modal, heroIcon, shell, showError } from "/js/app.js";
shell("/heroes.html");
const hs = await heroes(); let stats = new Map(); let rows = []; let active = null; let locked = null; const abCache = new Map();
const svg = { lock: "🔒", unlock: "🔓" };
function stage(x) { active = x; document.querySelectorAll(".hc").forEach((el) => { el.classList.toggle("active", +el.dataset.id === x.id); el.classList.toggle("locked", locked?.id === +el.dataset.id); });
  const st = stats.get(x.id); const el = $("#stage"); el.style.setProperty("--tint", x.color || "#4174bb"); el.classList.remove("in"); void el.offsetWidth;
  const abrow = h("div", { class: "abrow" });
  const isLocked = locked?.id === x.id;
  el.replaceChildren(h("div", { class: "bg", style: x.images.background ? `background-image:url(${x.images.background})` : "" }), h("div", { class: "tint" }), x.images.gloat ? h("img", { class: "art", src: x.images.gloat, alt: "" }) : "", h("div", { class: "sweep" }),
    h("div", { class: "info" }, x.images.name ? h("img", { class: "name", src: x.images.name, alt: x.name }) : h("h2", { class: "name" }, x.name),
      h("div", { class: "tags" }, ...(x.tags || []).map((t) => h("span", { class: "tag" }, t))),
      h("div", { style: "margin:12px 0" }, h("div", { class: "stat" }, h("b", { class: st ? (st.win_rate >= .5 ? "win" : "loss") : "" }, st ? pct(st.win_rate) : "–"), h("span", {}, "win rate")), h("div", { class: "stat" }, h("b", {}, st ? pct(st.pick_rate) : "–"), h("span", {}, "pick rate")), h("div", { class: "stat" }, h("b", {}, "●".repeat(x.complexity || 1) + "○".repeat(3 - (x.complexity || 1))), h("span", {}, "complexity")), x.gun_tag ? h("div", { class: "stat" }, h("b", {}, x.gun_tag), h("span", {}, "weapon")) : ""),
      abrow, x.description?.role ? h("p", {}, x.description.role) : "",
      h("div", { class: "actions" }, h("a", { class: "btn primary", href: `/hero.html?id=${x.id}` }, "Open hero page"), h("a", { class: "btn", href: `/counters.html?hero=${x.id}` }, "⚔ Matchups"), h("a", { class: "btn", href: `/editor.html?hero=${x.id}` }, "✎ New build"), h("a", { class: "btn", href: `/heatmap.html?hero=${x.id}` }, "◎ Heatmap"),
        h("button", { class: "btn lock" + (isLocked ? " on" : ""), title: isLocked ? "Unlock" : "Lock this hero", onclick: () => { locked = isLocked ? null : x; stage(x); } }, isLocked ? svg.lock + " Locked" : svg.unlock + " Lock"))));
  el.classList.add("in");
  const fill = (abs) => { if (active?.id !== x.id) return; abrow.replaceChildren(...abs.map((a) => withTipBuilder(h("img", { src: a.image, alt: a.name }), () => abilityTooltip(a)))); };
  if (abCache.has(x.id)) fill(abCache.get(x.id)); else api(`/heroes/${x.id}/abilities`).then((abs) => { abCache.set(x.id, abs); fill(abs); }).catch(() => {}); }
$("#grid").replaceChildren(...hs.map((x) => h("div", { class: "hc", "data-id": x.id, onmouseenter: () => { if (!locked) stage(x); }, onclick: () => { locked = locked?.id === x.id ? null : x; stage(locked || x); }, ondblclick: () => (location.href = `/hero.html?id=${x.id}`) }, h("img", { src: x.images.card || x.images.icon, alt: x.name, loading: "lazy" }), h("div", { class: "wr" }, x.name))));
async function loadStats() { const [lo, hi] = ($("#band").value || ",").split(","); const q = new URLSearchParams({ min_unix_timestamp: Math.floor(Date.now() / 1000) - 14 * 86400 }); if (lo) { q.set("min_average_badge", lo); q.set("max_average_badge", hi); }
  try { rows = await api(`/heroes/stats?${q}`); stats = new Map(rows.map((r) => [r.hero_id, r])); document.querySelectorAll(".hc").forEach((el) => { const s = stats.get(+el.dataset.id); if (s) el.querySelector(".wr").textContent = pct(s.win_rate); }); if (active) stage(active); } catch (e) { console.warn(e); } }
function metaTable() { let key = "win_rate", dir = -1; const body = h("div"); const render = () => { const sorted = [...rows].sort((a, b) => (a[key] > b[key] ? 1 : -1) * dir);
    body.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ...[["name", "Hero"], ["win_rate", "Win rate"], ["pick_rate", "Pick rate"], ["matches", "Matches"]].map(([k, t]) => h("th", { class: key === k ? "sorted" : "", onclick: () => { if (key === k) dir = -dir; else { key = k; dir = k === "name" ? 1 : -1; } render(); } }, t, key === k ? (dir < 0 ? " ▼" : " ▲") : "")))),
      h("tbody", {}, ...sorted.map((r) => h("tr", {}, h("td", {}, heroIcon(hs.find((x) => x.id === r.hero_id)), " ", h("a", { href: `/hero.html?id=${r.hero_id}` }, r.name)), h("td", { class: "num " + (r.win_rate >= .5 ? "win" : "loss") }, pct(r.win_rate)), h("td", { class: "num" }, pct(r.pick_rate)), h("td", { class: "num" }, r.matches.toLocaleString())))))); }; render(); return body; }
$("#metaBtn").onclick = () => modal(`Hero meta · last 14 days${$("#band").selectedIndex ? " · " + $("#band").selectedOptions[0].text : ""}`, metaTable());
$("#band").onchange = loadStats; stage(hs[Math.floor(Math.random() * hs.length)]); loadStats();
</script></body></html>
