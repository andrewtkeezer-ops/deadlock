<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soul Scribe — You're invited</title><meta name="description" content="Track your Deadlock games, build your loadouts, climb the ranks. Private squad stats.">
<link rel="icon" type="image/png" href="/img/icon.png"><link rel="preload" as="image" href="/img/bg.jpg">
<style>
@font-face{font-family:Jost;src:url(https://cdn.fastly.steamstatic.com/apps/deadlock/fonts/Jost-400-Book.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Oracle;src:url(https://cdn.fastly.steamstatic.com/apps/deadlock/fonts/VALVEOracle-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Pulp;src:url(https://cdn.fastly.steamstatic.com/apps/deadlock/fonts/VALVEPulp-Bold.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{--soul:#49d17e;--soul2:#1f8a4c;--cream:#f1e6c4;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#06100b;color:#ece7d8;font:15px/1.5 Jost,system-ui,sans-serif;overflow:hidden}
.scene{position:fixed;inset:-3%;background:#06100b url(/img/bg.jpg) center/cover no-repeat;animation:kb 45s ease-in-out infinite alternate;will-change:transform}
@media(max-width:1200px){.scene{background-image:url(/img/bg-1200.jpg)}}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-1%,.5%)}}
.fog{position:fixed;inset:-25%;pointer-events:none;background:radial-gradient(38% 30% at 28% 72%,rgba(73,209,126,.16),transparent 70%),radial-gradient(30% 30% at 72% 28%,rgba(73,209,126,.12),transparent 70%),radial-gradient(25% 25% at 55% 60%,rgba(73,209,126,.08),transparent 70%);filter:blur(42px);animation:drift 32s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.08)}}
.candle{position:fixed;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.35),rgba(255,160,60,.08) 45%,transparent 70%);filter:blur(10px);animation:flick 2.6s ease-in-out infinite alternate;mix-blend-mode:screen}
.c1{left:1.5%;top:58%;width:10vw;height:10vw}.c2{left:-1%;top:70%;width:8vw;height:8vw;animation-delay:-.9s}.c3{left:4%;top:80%;width:9vw;height:9vw;animation-delay:-1.7s}
@keyframes flick{0%{opacity:.75;transform:scale(1)}30%{opacity:1;transform:scale(1.08)}60%{opacity:.8;transform:scale(.97)}100%{opacity:.95;transform:scale(1.04)}}
.beacon{position:fixed;left:68.8%;top:29.5%;width:7vw;height:7vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(120,255,170,.55),rgba(73,209,126,.15) 45%,transparent 70%);filter:blur(8px);animation:pulse 4s ease-in-out infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(85% 75% at 50% 42%,transparent 50%,rgba(0,0,0,.65) 100%)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2}
.mark{width:min(22vw,180px);filter:drop-shadow(0 0 30px rgba(73,209,126,.55)) drop-shadow(0 10px 20px rgba(0,0,0,.6));animation:rise .9s .1s var(--ease) both,float 6s 1s ease-in-out infinite}
.word{width:min(62vw,680px);margin-top:0;filter:drop-shadow(0 6px 24px rgba(0,0,0,.8));animation:rise .9s .25s var(--ease) both}
.tag{margin:18px 0 26px;font-size:clamp(11px,1.2vw,14px);letter-spacing:.42em;text-transform:uppercase;color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.9);animation:rise .9s .4s var(--ease) both}.tag i{color:var(--soul);font-style:normal;margin:0 .6em}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(241,230,196,.6),transparent);position:relative;margin-bottom:26px;animation:rise .9s .5s var(--ease) both}.rule::after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--soul);font-size:9px;background:transparent}
.btn{position:relative;display:inline-flex;align-items:center;gap:0;border:1px solid rgba(73,209,126,.55);border-radius:12px;background:rgba(6,16,11,.72);backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(73,209,126,.18);color:var(--cream);text-decoration:none;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s;animation:rise .9s .6s var(--ease) both}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 26px 60px rgba(0,0,0,.65),0 0 60px rgba(73,209,126,.35)}
.btn .g{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(73,209,126,.35);position:relative}.btn .g::before{content:"";position:absolute;inset:10px;border-radius:50%;box-shadow:0 0 18px rgba(73,209,126,.5),inset 0 0 12px rgba(73,209,126,.25)}
.btn .g svg{width:28px;height:28px}.btn .t{padding:0 44px 0 26px;font-family:Oracle;font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;letter-spacing:.03em}.btn .a{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--cream);transition:transform .2s}.btn:hover .a{transform:translate(4px,-50%)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(-120%)}.btn:hover::after{animation:sheen .9s ease-out}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.note{display:none;margin-top:18px;max-width:520px;padding:12px 18px;border-radius:10px;border:1px solid rgba(229,87,79,.5);background:rgba(20,8,8,.75);backdrop-filter:blur(8px);color:#f3d9d6;font-size:13px;line-height:1.5;animation:rise .6s var(--ease) both}.note:not([hidden]){display:block}.note b{color:#fff}.note a{color:var(--soul);text-decoration:none}
.inv{margin:6px 0 4px;animation:rise .9s .3s var(--ease) both;max-width:560px}.inv .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--soul)}.inv h2{font-family:Reaver,Georgia,serif;font-size:clamp(20px,2.6vw,30px);margin:8px 0 6px;color:var(--cream);text-shadow:0 2px 14px rgba(0,0,0,.9)}.inv p{margin:0;color:#c9c4b4;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.9)}.inv .bad{color:#e5574f}
.legal{margin-top:22px;font-size:12px;color:rgba(236,231,216,.6);text-shadow:0 1px 8px rgba(0,0,0,.9);animation:rise .9s .75s var(--ease) both}.legal a{color:var(--soul);text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.enter{position:fixed;inset:0;background:#06100b;animation:fade 1.2s ease-out both;pointer-events:none;z-index:3}@keyframes fade{from{opacity:1}to{opacity:0}}
@media(max-aspect-ratio:1/1){.scene{background-position:52% center}.btn .t{font-size:18px;padding:0 40px 0 18px}.btn .g{width:56px;height:56px}.mark{width:34vw}.word{width:82vw}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

/* --- City Never Sleeps direction: display headline, stamp, drizzle, parallax --- */
.ui{--ink:#dd6638;--gold:#e8c76a}
.stamp{display:inline-block;margin:0 0 14px;padding:7px 14px 6px;background:var(--ink);color:#fff;font:600 11px/1 Oracle,sans-serif;letter-spacing:.3em;text-transform:uppercase;transform:rotate(-2.5deg);box-shadow:0 4px 0 rgba(0,0,0,.55),0 12px 28px rgba(0,0,0,.5);border-radius:2px;animation:stampOn .7s .15s cubic-bezier(.2,1.6,.3,1) both}
@keyframes stampOn{from{opacity:0;transform:rotate(-14deg) scale(1.6)}to{opacity:1;transform:rotate(-2.5deg) scale(1)}}
.head{margin:6px 0 4px;font:700 clamp(30px,4.6vw,58px)/.95 Pulp,Oracle,Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--cream);transform:rotate(-1.5deg);cursor:default;max-width:900px}
.head .ch{display:inline-block;animation:chIn .75s cubic-bezier(.2,1.4,.3,1) both;animation-delay:calc(.45s + var(--i) * 24ms);background:linear-gradient(180deg,#f7e9d5 0%,#f1e6c4 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(181,141,42,.9)) drop-shadow(0 6px 0 rgba(30,22,8,.9)) drop-shadow(0 16px 28px rgba(0,0,0,.7))}
.head .sp{display:inline-block;width:.3em}.head .ch.wave{animation:chWave .55s cubic-bezier(.2,1.4,.3,1) var(--d,0ms) both}
@keyframes chIn{0%{opacity:0;transform:translateY(-.6em) rotate(-10deg) scale(1.25)}55%{opacity:1;transform:translateY(.08em) rotate(2deg) scale(.96)}100%{opacity:1;transform:none}}
@keyframes chWave{0%{transform:none}30%{transform:translateY(-.22em) rotate(-6deg) scale(1.08);filter:drop-shadow(-3px 0 0 #60cde3) drop-shadow(3px 0 0 #dd6638) drop-shadow(0 16px 28px rgba(0,0,0,.6))}100%{transform:none}}
.rain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.5;z-index:1}
.scene,.fog{translate:var(--px,0) var(--py,0);transition:translate .25s linear}
.flick{animation:flickN .9s steps(1,end)!important}@keyframes flickN{0%{opacity:1}8%{opacity:.35}12%{opacity:1}20%{opacity:.6}24%{opacity:1}64%{opacity:.5}68%{opacity:1}100%{opacity:1}}
.btn{transform:translate(var(--mx,0),var(--my,0))}.btn:hover{transform:translate(var(--mx,0),calc(var(--my,0) - 2px))}
.word{width:min(44vw,480px)}
@media(max-width:700px){.head{transform:none;font-size:clamp(26px,8vw,40px)}.stamp{font-size:10px;letter-spacing:.22em}.word{width:72vw}}
@media(prefers-reduced-motion:reduce){.rain{display:none}.head .ch{animation:none;opacity:1}}
</style></head>
<body>
<div class="scene" role="img" aria-label="A green-lit city at night: a gargoyle, candles and an old book in the foreground, a glowing compass tower beyond."></div>
<div class="fog"></div><div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div><div class="beacon"></div><div class="vig"></div>
<div class="ui">
  <div class="stamp">You're invited</div>
  <img class="word" src="/img/logo.webp" alt="Soul Scribe">
  <div class="inv" id="inv"><div class="eyebrow">You're invited</div><h2 id="invTitle" class="head" style="font-size:clamp(26px,3.6vw,44px)">Loading your invite…</h2><p id="invBody"></p></div>
  <div class="tag">Track<i>✦</i>Build<i>✦</i>Climb</div>
  <div class="rule"></div>
  <a class="btn" id="go" href="/api/auth/google/login"><span class="g"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.3l6.7-6.7C35.6 2.3 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.1 0 11.2-2 15-5.5l-7.5-5.8c-2 1.4-4.6 2.3-7.5 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg></span><span class="t">Continue with Google</span><span class="a">→</span></a>
  <div class="note" id="note" hidden></div>
  <div class="legal">By continuing, you agree to our <a href="/terms.html">Terms of Service</a> and <a href="/privacy.html">Privacy Policy</a>.</div>
</div>
<div class="enter"></div>
<script>
(() => { const q = new URLSearchParams(location.search), n = document.getElementById("note");
  if (q.get("denied")) { n.innerHTML = `<b>${q.get("denied").replace(/[<>&]/g, "")}</b> isn't on the squad list yet. Ask Andrew for an invite, or <a href="/api/auth/google/logout">try another Google account</a>.`; n.hidden = false; }
  else if (q.get("error")) { n.textContent = "Google sign-in didn't complete. Please try again."; n.hidden = false; } })();
</script>
<script>
(async () => { const t = new URLSearchParams(location.search).get("t"); const T = document.getElementById("invTitle"), B = document.getElementById("invBody");
  if (!t) { T.textContent = "This invite link is incomplete."; window.splitHead?.(T); B.innerHTML = 'Ask whoever sent it for the full link, or <a href="/">sign in</a> if you\'re already a member.'; return; }
  try { const r = await fetch("/api/invite/" + encodeURIComponent(t)); if (!r.ok) throw 0; const d = await r.json();
    T.textContent = `${d.inviter} invited you to the squad`; window.splitHead?.(T); B.innerHTML = d.accepted ? `This invite was already accepted. Sign in with <b>${d.email}</b>.` : `Sign in with <b>${d.email}</b> to join. That's the Google account this invite is tied to.`;
  } catch { T.textContent = "That invite link isn't valid."; window.splitHead?.(T); B.innerHTML = '<span class="bad">It may have been revoked.</span> Ask the admin to send a new one.'; } })();
</script>
<script>
(() => { const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches, coarse = matchMedia("(hover: none)").matches;
  // headline: letter by letter, wave on hover
  const split = (el) => { if (!el) return; const text = el.textContent; el.setAttribute("aria-label", text.trim()); el.textContent = ""; let i = 0; for (const ch of text) { const s = document.createElement("span"); if (ch === " ") { s.className = "sp"; s.textContent = " "; } else { s.className = "ch"; s.style.setProperty("--i", i++); s.textContent = ch; } s.setAttribute("aria-hidden", "true"); el.append(s); } el.querySelectorAll(".ch").forEach((c) => c.style.setProperty("--i", Math.min(+c.style.getPropertyValue("--i"), 40))); }; window.splitHead = split;
  const el = document.getElementById("head"); if (el) { split(el);
    if (!coarse && !reduced) el.addEventListener("pointerenter", (e) => { const chs = [...el.querySelectorAll(".ch")]; const r = el.getBoundingClientRect(); const from = Math.min(chs.length - 1, Math.max(0, Math.round((e.clientX - r.left) / r.width * chs.length))); chs.forEach((c, k) => { c.style.setProperty("--d", `${Math.abs(k - from) * 28}ms`); c.classList.remove("wave"); void c.offsetWidth; c.classList.add("wave"); }); }); }
  if (reduced) return;
  // drizzle
  const cv = document.createElement("canvas"); cv.className = "rain"; cv.setAttribute("aria-hidden", "true"); document.body.append(cv); const c = cv.getContext("2d"); let W, H, drops = [];
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; drops = Array.from({ length: Math.round(W / 12) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 14 + Math.random() * 24, v: 2.6 + Math.random() * 2.4, a: .05 + Math.random() * .1 })); }; size(); addEventListener("resize", size);
  let last = 0; (function tick(t) { requestAnimationFrame(tick); if (document.hidden || t - last < 33) return; last = t; c.clearRect(0, 0, W, H); c.lineWidth = 1; c.lineCap = "round"; for (const d of drops) { c.strokeStyle = `rgba(214,232,240,${d.a})`; c.beginPath(); c.moveTo(d.x, d.y); c.lineTo(d.x - d.l * .18, d.y + d.l); c.stroke(); d.y += d.v * 2.2; d.x -= d.v * .4; if (d.y > H) { d.y = -d.l; d.x = Math.random() * (W + 80); } } })(0);
  // stamp flicker, like a tired neon sign
  const flick = () => { const s = document.querySelector(".stamp"); if (s) { s.classList.add("flick"); setTimeout(() => s.classList.remove("flick"), 900); } setTimeout(flick, 5000 + Math.random() * 8000); }; setTimeout(flick, 3000);
  if (coarse) return;
  // parallax + magnetic button
  let tx = 0, ty = 0, x = 0, y = 0; addEventListener("pointermove", (e) => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; const b = e.target.closest?.(".btn"); document.querySelectorAll(".btn").forEach((el) => { if (el === b) { const r = el.getBoundingClientRect(); el.style.setProperty("--mx", `${(e.clientX - (r.left + r.width / 2)) / r.width * 8}px`); el.style.setProperty("--my", `${(e.clientY - (r.top + r.height / 2)) / r.height * 5}px`); } else { el.style.setProperty("--mx", "0px"); el.style.setProperty("--my", "0px"); } }); }, { passive: true });
  (function loop() { x += (tx - x) * .04; y += (ty - y) * .04; document.documentElement.style.setProperty("--px", `${(-x * 22).toFixed(2)}px`); document.documentElement.style.setProperty("--py", `${(-y * 14).toFixed(2)}px`); requestAnimationFrame(loop); })();
})();
</script>
</body></html>
