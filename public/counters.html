<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{if(!sessionStorage.getItem("ss.booted")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("booting")}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counters · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/app.css">
<style>
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}@media(max-width:800px){.board{grid-template-columns:1fr}}
.team{border-radius:12px;padding:14px;border:1px solid var(--line)}.team.ally{background:linear-gradient(180deg,#1a2416,#171922);border-color:#2f5a2a}.team.enemy{background:linear-gradient(180deg,#2a1818,#171922);border-color:#5a2a2a}
.team h3{margin:0 0 10px;font-family:var(--fh);text-transform:uppercase;letter-spacing:.04em}.slots{display:flex;gap:8px;flex-wrap:wrap;min-height:70px}
.slot{width:64px;height:64px;border-radius:8px;border:2px dashed #3a3f55;display:flex;align-items:center;justify-content:center;color:#3a3f55;font-size:24px;cursor:pointer;background:#0f1118;position:relative}.slot img{width:100%;height:100%;object-fit:cover;border-radius:6px}.slot.filled{border-style:solid;border-color:var(--accent)}.slot .x{position:absolute;top:-8px;right:-8px;background:#000;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;text-align:center;color:#fff}
.vs{font-family:var(--fh);font-size:28px;color:var(--muted);align-self:center;padding:30px 0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:10px}.picker img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;opacity:.9}.picker img:hover{border-color:var(--accent);opacity:1}.picker img.taken{opacity:.25;pointer-events:none}
.sug .r{display:grid;grid-template-columns:40px 1.2fr 70px 80px 80px 1.6fr 90px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.sug .r:first-child{color:var(--accent)}.sug .why{font-size:12px;color:var(--muted);line-height:1.3}.sug .why b{color:var(--cream);font-weight:600}.sug .me{font-size:12px}.sug .me b{font-family:var(--fh)}.sug .star{color:var(--accent);margin-right:4px}@media(max-width:800px){.sug .r{grid-template-columns:36px 1fr 60px 70px}.sug .r>:nth-child(n+5){display:none}}
.mu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.mu .r{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
/* v6: the side being filled is obvious; slots are real buttons */
.board .team{transition:box-shadow .25s,border-color .25s,opacity .25s}.board .team:not(.on){opacity:.72}
.board .team.ally.on{box-shadow:0 0 0 2px var(--lane-g),0 0 34px -8px rgba(151,218,121,.45)}.board .team.enemy.on{box-shadow:0 0 0 2px var(--loss),0 0 34px -8px rgba(229,87,79,.45)}
button.slot{padding:0;font:400 24px/1 var(--fb);letter-spacing:0;box-shadow:none;cursor:pointer;color:#6d7592}button.slot:hover{color:var(--cream);border-color:var(--cream)}button.slot.next{border-color:var(--cream);color:var(--cream);animation:slotNext 1.6s ease-in-out infinite}@keyframes slotNext{50%{box-shadow:0 0 0 4px rgba(247,233,213,.12)}}
#picker img:focus-visible{outline:2px solid var(--lane-b);outline-offset:2px}
@media(prefers-reduced-motion:reduce){button.slot.next{animation:none}}
</style></head>
<body><main>
<h1>Draft helper</h1><p class="muted">Fill in the heroes already locked on each side; Soul Scribe ranks what's left by synergy with your team and win rate against theirs, and marks the ones you personally do well on. <span id="pickingFor"></span></p>
<div class="board">
<div class="team ally"><h3>Your team</h3><div class="slots" id="allySlots"></div></div>
<div class="vs">VS</div>
<div class="team enemy"><h3>Enemy team</h3><div class="slots" id="enemySlots"></div></div>
</div>
<div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><strong>Add to:</strong> <button id="toAlly" class="primary">Your team</button> <button id="toEnemy">Enemy team</button> <button id="shareDraft" type="button" hidden>Copy link</button><button id="clearDraft" type="button" hidden>Clear</button><input type="text" id="q" placeholder="Filter, Enter to add…" aria-label="Filter heroes" style="margin-left:auto"></div><div id="picker" class="picker"></div></div>
<div class="card"><h2 style="margin-top:0">Suggested picks</h2><div id="out" class="sug muted">Add at least one hero.</div></div>
<div id="matchups"></div>
</main>
<script type="module">
import { api, h, $, pct, heroes, heroIcon, shell, showError } from "/js/app.js";
const meP = (async () => { try { const m = await (await fetch("/api/me")).json(); if (!m.account_id) return new Map(); const d = await api(`/players/${m.account_id}`); return new Map(d.heroes.map((r) => [r.hero_id, r])); } catch { return new Map(); } })();
shell("/counters.html");
const hs = await heroes(); const picks = { allies: [], enemies: [] }; let side = "allies";
const hx = (id) => hs.find((x) => x.id === id);
const setSide = (k) => { side = k; render(); };
function renderSlots() { for (const [k, el, n] of [["allies", $("#allySlots"), 6], ["enemies", $("#enemySlots"), 6]]) { el.closest(".team").classList.toggle("on", side === k);
  el.replaceChildren(...Array.from({ length: n }, (_, i) => { const id = picks[k][i]; return id ? h("button", { type: "button", class: "slot filled", title: `Remove ${hx(id)?.name}`, "aria-label": `Remove ${hx(id)?.name}`, onclick: () => { picks[k].splice(i, 1); render(); } }, h("img", { src: hx(id)?.images?.card || hx(id)?.images?.icon, alt: "" }), h("span", { class: "x", "aria-hidden": "true" }, "×")) : h("button", { type: "button", class: "slot" + (side === k && i === picks[k].length ? " next" : ""), "aria-label": `Add to ${k === "allies" ? "your team" : "enemy team"}`, onclick: () => setSide(k) }, "+"); })); } }
const add = (x) => { if (picks[side].length >= 6 || picks.allies.includes(x.id) || picks.enemies.includes(x.id)) return; picks[side].push(x.id); if (picks[side].length >= 6 && picks[side === "allies" ? "enemies" : "allies"].length < 6) side = side === "allies" ? "enemies" : "allies"; render(); };
function renderPicker() { const q = $("#q").value.toLowerCase(); const taken = new Set([...picks.allies, ...picks.enemies]);
  $("#picker").replaceChildren(...hs.filter((x) => !q || x.name.toLowerCase().includes(q)).map((x) => h("img", { src: x.images?.card || x.images?.icon, title: x.name, alt: x.name, tabindex: taken.has(x.id) ? "-1" : "0", role: "button", class: taken.has(x.id) ? "taken" : "", onclick: () => add(x), onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); add(x); } } }))); }
async function suggest() { const out = $("#out"); if (!picks.allies.length && !picks.enemies.length) { out.className = "sug muted"; out.textContent = "Add at least one hero."; return; } out.textContent = "Thinking…";
  try { const [r, mine] = await Promise.all([api(`/heroes/suggest?allies=${picks.allies}&enemies=${picks.enemies}`), meP]); out.className = "sug";
    // comfort bonus: your own win rate on the hero (needs 3+ games) nudges the ranking
    const rows = r.suggestions.map((s) => { const m = mine.get(s.hero_id); const comfort = m && m.games >= 3 ? (m.wins / m.games - 0.5) * 0.5 : 0; return { ...s, m, total: s.score + comfort }; }).sort((a, b) => b.total - a.total);
    const nm = (id) => hx(id)?.name ?? "?";
    out.replaceChildren(h("div", { class: "r muted", style: "font-size:12px;text-transform:uppercase" }, h("span"), h("span", {}, "Hero"), h("span", {}, "Score"), h("span", {}, "With allies"), h("span", {}, "Vs enemies"), h("span", {}, "Why"), h("span", {}, "You")),
      ...rows.slice(0, 12).map((s) => h("div", { class: "r" }, heroIcon(hx(s.hero_id), 36), h("a", { href: `/hero.html?id=${s.hero_id}` }, s.m && s.m.games >= 3 && s.m.wins / s.m.games >= .55 ? h("span", { class: "star", title: "You win a lot on this hero" }, "★") : "", s.name), h("b", {}, (s.total * 100).toFixed(1)), h("span", { class: s.synergy >= .5 ? "win" : "loss" }, s.best_with ? pct(s.synergy) : "–"), h("span", { class: s.counter >= .5 ? "win" : "loss" }, s.best_vs ? pct(s.counter) : "–"),
        h("div", { class: "why" }, s.best_vs ? [h("b", {}, `${pct(s.best_vs.wr)} vs ${nm(s.best_vs.id)}`), s.worst_vs && s.worst_vs.id !== s.best_vs.id ? ` · weak into ${nm(s.worst_vs.id)} (${pct(s.worst_vs.wr)})` : ""] : "", s.best_with ? [s.best_vs ? h("br") : "", `pairs with ${nm(s.best_with.id)} (${pct(s.best_with.wr)})`] : "", !s.best_vs && !s.best_with ? "not enough data" : ""),
        h("div", { class: "me" }, s.m ? [h("b", { class: s.m.wins / s.m.games >= .5 ? "win" : "loss" }, pct(s.m.wins / s.m.games)), h("span", { class: "muted" }, ` · ${s.m.games}g`)] : h("span", { class: "muted" }, "never played")))));
    if (!mine.size) out.append(h("p", { class: "muted", style: "font-size:12px;margin:10px 0 0" }, "Sign in through Steam and your own hero record will factor in (★ = heroes you win on).")); } catch (e) { showError(out, e); } }
// The draft lives in the address bar (?a=1,2&e=3), so a line-up can be pasted to the squad and survives a reload.
const qs0 = new URLSearchParams(location.search); const ids = (v) => (v || "").split(",").map(Number).filter((n) => hx(n)).slice(0, 6);
picks.allies = ids(qs0.get("a")); picks.enemies = ids(qs0.get("e")).filter((n) => !picks.allies.includes(n));
let lastKey = null;
function render() { $("#toAlly").className = side === "allies" ? "primary" : ""; $("#toEnemy").className = side === "enemies" ? "primary" : ""; renderSlots(); renderPicker();
  const key = `${picks.allies}|${picks.enemies}`; if (key !== lastKey) { lastKey = key; suggest(); const u = new URLSearchParams(location.search); picks.allies.length ? u.set("a", picks.allies.join(",")) : u.delete("a"); picks.enemies.length ? u.set("e", picks.enemies.join(",")) : u.delete("e"); history.replaceState(null, "", location.pathname + (u.toString() ? "?" + u.toString().replace(/%2C/g, ",") : "")); }
  const any = picks.allies.length + picks.enemies.length; $("#clearDraft").hidden = !any; $("#shareDraft").hidden = !any;
  $("#pickingFor").textContent = `Adding to: ${side === "allies" ? "your team" : "enemy team"}.`; }
$("#toAlly").onclick = () => setSide("allies"); $("#toEnemy").onclick = () => setSide("enemies"); $("#q").oninput = renderPicker;
$("#q").onkeydown = (e) => { if (e.key !== "Enter") return; const q = $("#q").value.toLowerCase(); const taken = new Set([...picks.allies, ...picks.enemies]); const first = q && hs.find((x) => x.name.toLowerCase().includes(q) && !taken.has(x.id)); if (first) { add(first); $("#q").value = ""; renderPicker(); } };
$("#clearDraft").onclick = () => { picks.allies = []; picks.enemies = []; side = "allies"; render(); };
$("#shareDraft").onclick = async (e) => { const b = e.currentTarget; try { await navigator.clipboard.writeText(location.href); b.textContent = "Link copied"; } catch { b.textContent = "Copy the address bar"; } setTimeout(() => (b.textContent = "Copy link"), 1800); };
render();
const pre = new URLSearchParams(location.search).get("hero");
if (pre) { try { const m = await api(`/heroes/${pre}/matchups`); const row = (r, cls) => h("div", { class: "r" }, heroIcon(hx(r.hero_id)), h("a", { href: `/hero.html?id=${r.hero_id}`, style: "flex:1" }, r.name), h("span", { class: "num " + cls(r) }, pct(r.win_rate)), h("span", { class: "muted", style: "font-size:12px" }, `${r.matches}`));
  const tbl = (title, rows, cls) => h("div", { class: "card", style: "margin:0" }, h("h3", { style: "margin-top:0" }, title), ...rows.slice(0, 10).map((r) => row(r, cls)));
  $("#matchups").replaceChildren(h("h2", {}, `${m.name} matchups`), h("div", { class: "mu" }, tbl(`${m.name} struggles against`, m.counters, (r) => "loss"), tbl(`${m.name} beats`, [...m.counters].reverse(), (r) => "win"), tbl(`Best teammates for ${m.name}`, m.synergies, () => "win"))); } catch (e) { showError($("#matchups"), e); } }
</script></body></html>
