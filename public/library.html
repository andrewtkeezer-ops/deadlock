<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Builds · Soul Scribe</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/icon.png"><link rel="stylesheet" href="/css/app.css"></head>
<body><main><h1>Build library</h1>
<p><button id="tabMine" class="primary">My builds</button> <button id="tabSquad">Squad builds</button> &nbsp; Hero: <select id="hero"><option value="">All</option></select> <span id="authorWrap" hidden>By: <select id="author"><option value="">Anyone</option></select></span> &nbsp; <a class="dl" style="padding:8px 14px;font-size:14px" href="/editor.html">+ New build</a> <a href="/builds.html" style="margin-left:10px">or start from the wizard</a></p>
<p id="signin" class="muted" hidden>Sign in through Steam (top right) to make and keep your own builds.</p>
<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><strong>Start from a proven build:</strong> <select id="starterHero"><option value="">Pick a hero…</option></select> <span class="muted">opens the hero page with the top Weapon, Spirit, Survivability and Balanced builds, each one click from your library.</span></div>
<div id="list" class="grid"></div></main>
<script type="module">
import { api, h, $, ago, heroes, itemImg, shell, showError } from "/js/app.js";
shell("/library.html");
const [hs, items, players, me, who] = await Promise.all([heroes(), api("/library/items"), api("/players"), api("/auth/steam/me"), api("/me")]);
let tab = me.account_id ? "mine" : "squad"; if (!me.account_id) $("#signin").hidden = false;
const superAdmin = who.role === "admin" && !who.unconfigured; $("#authorWrap").hidden = !superAdmin;
const setTab = (t) => { tab = t; $("#tabMine").className = t === "mine" ? "primary" : ""; $("#tabSquad").className = t === "squad" ? "primary" : ""; load(); };
$("#tabMine").onclick = () => setTab("mine"); $("#tabSquad").onclick = () => setTab("squad");
const hero = (id) => hs.find((x) => x.id === id), item = (id) => items.find((x) => x.id === id);
hs.forEach((x) => { $("#hero").append(new Option(x.name, x.id)); $("#starterHero").append(new Option(x.name, x.id)); }); $("#starterHero").onchange = (e) => { if (e.target.value) location.href = `/hero.html?id=${e.target.value}#starters`; }; players.forEach((p) => $("#author").append(new Option(p.name, p.account_id)));
async function load() { const el = $("#list"); try {
  const q = new URLSearchParams(); if ($("#hero").value) q.set("hero_id", $("#hero").value);
  if (tab === "mine") { if (!me.account_id) return el.replaceChildren(h("p", { class: "muted" }, "Sign in through Steam to see your builds.")); q.set("account_id", me.account_id); }
  else if (superAdmin && $("#author").value) q.set("account_id", $("#author").value);
  const rows = await api(`/library?${q}`);
  if (!rows.length) return el.replaceChildren(h("p", { class: "muted" }, tab === "mine" ? "You haven't saved a build yet." : "Nobody has saved a build yet."));
  el.replaceChildren(...rows.map((b) => h("div", { class: "card", style: "margin:0;display:flex;flex-direction:column;gap:8px" },
    h("div", { style: "display:flex;gap:10px;align-items:center" }, hero(b.hero_id)?.images?.card ? h("img", { src: hero(b.hero_id).images.card, width: 44, height: 58, style: "border-radius:6px;object-fit:cover" }) : "",
      h("div", {}, h("a", { href: `/editor.html?id=${b.id}` }, h("strong", {}, b.title)), h("div", { class: "muted", style: "font-size:13px" }, `${hero(b.hero_id)?.name ?? "?"} · ${b.author_name ?? b.author}${b.ingame_build_id ? " · in game" : ""}`))),
    b.description ? h("div", { class: "muted", style: "font-size:13px" }, b.description.slice(0, 140)) : "",
    h("div", { style: "display:flex;flex-wrap:wrap;gap:3px" }, ...b.preview.map((id) => itemImg(item(id), 26))),
    h("div", { class: "muted", style: "font-size:12px;display:flex;justify-content:space-between" }, h("span", {}, `${b.item_count} items · updated ${ago(b.updated_at || b.created_at)}`),
      h("span", {}, h("a", { href: `/editor.html?id=${b.id}` }, me.account_id === b.account_id ? "edit" : "view / fork"), " · ", h("a", { href: "#", onclick: async (e) => { e.preventDefault(); await api(`/library/${b.id}/vote`, { method: "POST" }); load(); } }, `▲ ${b.votes}`)))))); } catch (e) { showError(el, e); } }
$("#hero").onchange = $("#author").onchange = load; setTab(tab);
</script></body></html>
