<script type="module">
// Profile sections as tabs: a sliding switch on top, panels slide sideways, the frame eases to each panel's height.
import { segmented } from "/js/app.js";
const view = document.getElementById("pview"), track = document.getElementById("ptrack"), panels = [...track.children];
const keys = panels.map((p) => p.dataset.tab), alias = { achievements: "achievements", records: "overview", heroes: "overview" };
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = Math.max(0, keys.indexOf(alias[location.hash.slice(1)] || location.hash.slice(1) || "overview"));
const sw = segmented(panels.map((p) => [p.dataset.tab, p.dataset.label]), keys[cur], (k) => go(keys.indexOf(k)), "Profile sections");
document.getElementById("ptabbar").append(sw);
function fit() { view.style.height = panels[cur].offsetHeight + "px"; }
function go(i, instant = false) {
  if (i < 0 || i >= panels.length) return; const back = i < cur; cur = i; sw.set(keys[i]);
  track.style.transition = instant || RM ? "none" : ""; track.style.transform = `translateX(${-i * 100}%)`;
  panels.forEach((p, k) => { const on = k === i; p.toggleAttribute("inert", !on); p.setAttribute("aria-hidden", String(!on)); p.classList.toggle("on", on); p.classList.toggle("from-left", on && back); });
  fit(); history.replaceState(null, "", i ? `#${keys[i]}` : location.pathname + location.search);
  if (!instant) { const top = document.getElementById("ptabbar").getBoundingClientRect().top; if (top < 0) scrollBy({ top: top - 12, behavior: RM ? "auto" : "smooth" }); }
}
new ResizeObserver(fit).observe(track); panels.forEach((p) => new ResizeObserver(() => panels[cur] === p && fit()).observe(p));
go(cur, true);
addEventListener("hashchange", () => { const k = alias[location.hash.slice(1)] || location.hash.slice(1); const i = keys.indexOf(k); if (i >= 0 && i !== cur) go(i); });
addEventListener("keydown", (e) => { if (e.target.closest("input,select,textarea") || e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === "ArrowRight" && document.activeElement?.closest("#ptabbar")) go(cur + 1); if (e.key === "ArrowLeft" && document.activeElement?.closest("#ptabbar")) go(cur - 1); });

</script>
