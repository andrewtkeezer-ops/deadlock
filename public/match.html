<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match · Soul Scribe</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main><h1>Match <span id="mid"></span></h1><div id="out" class="card">Loading…</div>
<p class="muted">TODO: render the 12-player scoreboard, items bought (with timings) and ability order from the metadata JSON below. Field names are in <code>match_info.players[]</code>.</p>
<pre id="raw"></pre></main>
<script type="module">
import { api, $, shell, showError } from "/js/app.js";
shell("/");
const id = new URLSearchParams(location.search).get("id"); $("#mid").textContent = id;
try { const m = await api(`/players/match/${id}`); $("#out").textContent = `Loaded. ${m.match_info?.players?.length ?? "?"} players, duration ${m.match_info?.duration_s ?? "?"}s.`; $("#raw").textContent = JSON.stringify(m, null, 2).slice(0, 20000); }
catch (e) { showError($("#out"), e); }
</script></body></html>
