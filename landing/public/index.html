<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soul Scribe</title><meta name="description" content="Track your Deadlock games, build your loadouts, climb the ranks. Private squad stats.">
<link rel="icon" type="image/png" href="https://deadlock.andrewtkeezer.workers.dev/img/favicon.png">
<style>
:root{--app:https://deadlock.andrewtkeezer.workers.dev/}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#06100b;color:#ece7d8;font:15px/1.5 Radiance,system-ui,sans-serif;overflow:hidden}
.scene{position:fixed;inset:0;background:#06100b url(/img/login.jpg) center/cover no-repeat;animation:kb 40s ease-in-out infinite alternate}
@media(max-width:1200px){.scene{background-image:url(/img/login-1200.jpg)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.fog{position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(40% 30% at 30% 70%,rgba(73,209,126,.14),transparent 70%),radial-gradient(35% 30% at 70% 30%,rgba(73,209,126,.1),transparent 70%);filter:blur(40px);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-3%,-2%)}to{transform:translate(3%,2%)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
/* clickable region over the painted button (percent of the artwork) */
.go{position:fixed;left:35.3%;top:65.3%;width:29.4%;height:9.4%;border-radius:10px;cursor:pointer;display:block;outline:0;transition:box-shadow .2s,transform .2s}
.go:hover,.go:focus-visible{box-shadow:0 0 0 2px rgba(73,209,126,.7),0 0 40px rgba(73,209,126,.45);transform:translateY(-1px)}
.go::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);opacity:0}.go:hover::after{animation:sheen .8s ease-out}
@keyframes sheen{from{transform:translateX(-120%);opacity:1}to{transform:translateX(120%);opacity:0}}
.legal{position:fixed;left:0;right:0;top:78%;text-align:center;font-size:12px;color:rgba(236,231,216,.55);pointer-events:none}.legal a{pointer-events:auto;color:#49d17e}
.enter{position:fixed;inset:0;background:#06100b;animation:fade 1.1s ease-out both;pointer-events:none}@keyframes fade{from{opacity:1}to{opacity:0}}
.sr{position:absolute;left:-9999px}
@media(max-aspect-ratio:1/1){.scene{background-position:52% center}.go{left:12%;width:76%;top:62%;height:9%}.legal{top:74%}}
</style></head>
<body>
<div class="scene" role="img" aria-label="Soul Scribe — a green-lit city at night"></div><div class="fog"></div><div class="vig"></div>
<a class="go" id="go" href="https://deadlock.andrewtkeezer.workers.dev/"><span class="sr">Continue with Google</span></a>
<div class="enter"></div>
<script>
// Already signed in? Skip the splash. (Access cookie is on the app's origin, so we probe it.)
fetch("https://deadlock.andrewtkeezer.workers.dev/api/me", { credentials: "include", mode: "cors" }).then(r => { if (r.ok) location.replace("https://deadlock.andrewtkeezer.workers.dev/"); }).catch(() => {});
</script>
</body></html>
